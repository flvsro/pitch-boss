<body>
<title>Pitch Boss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-shaped column (header bar, scrolling body, soft-key bar), like a 2000s Java handset game. Single dark pitch-green look by design. */
:root{
  --bg:#0A1A10; --deep:#04110A; --panel:#0F2A1B; --panel2:#123524; --line:#1E4D32; --line2:#2E6B47;
  --ink:#E6F4EA; --muted:#9FCBAE; --green:#3DDC84; --amber:#F2C94C; --red:#FF8A8A; --blue:#6EC1FF; --onamber:#1A1200;
  --turf:#5BBF85;
  --px:'Silkscreen',ui-monospace,monospace; --tx:'VT323',ui-monospace,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--tx);font-size:22px;display:flex;justify-content:center}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.device{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media (min-width:640px) and (min-height:760px){.device{height:min(100%,820px);align-self:center;border:3px solid var(--line2);box-shadow:6px 6px 0 var(--deep)}}
.hdr{flex:none;height:56px;background:var(--green);color:var(--deep);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 var(--gr) 0 var(--gl);font-family:var(--px);font-weight:700;font-size:16px;letter-spacing:1px}
.hdr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px var(--gr) 14px var(--gl);display:flex;flex-direction:column;gap:10px}
.soft{flex:none;min-height:52px;background:var(--panel2);border-top:2px solid var(--line2);display:flex;padding:0 var(--gr) 0 var(--gl)}
.soft.col{flex-direction:column;padding-top:0}
.soft button{flex:1;min-height:50px;background:transparent;border:0;color:var(--amber);font-family:var(--px);font-weight:700;font-size:14px;cursor:pointer;padding:0 6px;letter-spacing:.5px}
.soft button.l{text-align:left}.soft button.r{text-align:right}.soft button.c{text-align:center}
.srow{display:flex;min-height:46px}.srow button{min-height:46px}
.toast{position:absolute;left:var(--gl);right:var(--gr);bottom:68px;background:var(--amber);color:var(--onamber);padding:8px 12px;font-size:22px;z-index:8;box-shadow:3px 3px 0 var(--deep)}
.ovl{position:absolute;inset:0;background:#04110AF2;z-index:6;display:flex;flex-direction:column}
.ovb{flex:1;min-height:0;overflow-y:auto;padding:12px var(--gr) 14px var(--gl);display:flex;flex-direction:column;gap:8px}
.hero{flex:none;height:210px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#0F3B22 0 30px,#124528 30px 60px);border-bottom:3px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:-12px calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.hero .ln{position:absolute;left:0;right:0;top:50%;height:2px;background:#2E8B57}
.hero .ci{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border:2px solid #2E8B57;border-radius:50%}
.hero .ball{position:relative;width:42px;height:42px;border-radius:50%;background:var(--ink);border:3px solid var(--deep);display:flex;align-items:center;justify-content:center}
.hero .ball i{width:15px;height:15px;background:var(--deep);transform:rotate(45deg)}
.hero .ti{position:relative;display:flex;flex-direction:column;align-items:center;font-family:var(--px);font-weight:700;font-size:42px;line-height:1;letter-spacing:2px;text-shadow:3px 3px 0 var(--deep)}
.hero .sub{position:relative;background:var(--deep);padding:2px 10px;font-size:22px;letter-spacing:1px}
.mbtn{height:46px;width:100%;flex:none;background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:26px;text-align:left;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;box-shadow:3px 3px 0 var(--deep)}
.mbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn.sm{font-size:24px}
.mbtn.sel{background:var(--amber);border-color:var(--amber);color:var(--onamber)}
.mbtn .r{color:var(--muted);flex:none}.mbtn.sel .r{color:var(--onamber)}
.badge{background:var(--amber);color:var(--onamber);min-width:22px;height:22px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:20px}
.card{background:var(--panel);border:2px solid var(--line);padding:10px 12px;box-shadow:3px 3px 0 var(--deep);display:flex;flex-direction:column;gap:4px;flex:none}
.card.dark{background:var(--deep)}
.lbl{font-family:var(--px);font-size:12px;color:var(--muted);letter-spacing:1px}
.big{font-size:32px;line-height:1}.huge{font-family:var(--px);font-weight:700;font-size:34px;color:var(--amber);letter-spacing:2px}
.mut{color:var(--muted)}.amb{color:var(--amber)}.grn{color:var(--green)}.red{color:var(--red)}.blu{color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.stat{background:var(--panel);border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-weight:400;font-size:28px;line-height:1;color:var(--amber)}
.fl{display:flex;gap:6px;align-items:center}
.fl i{font-style:normal;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--deep);font-size:22px}
.W{background:var(--green)}.D{background:var(--muted)}.L{background:var(--red)}
.btnbig{height:52px;width:100%;flex:none;background:var(--amber);border:2px solid var(--amber);color:var(--onamber);font-family:var(--px);font-weight:700;font-size:16px;letter-spacing:1px;cursor:pointer;box-shadow:3px 3px 0 var(--deep)}
.btnbig.alt{background:var(--panel);border-color:var(--line);color:var(--amber)}
.btnbig.bad{background:var(--red);border-color:var(--red);color:var(--deep)}
.tbl{display:flex;flex-direction:column;flex:none}
.th,.tr{display:grid;grid-template-columns:var(--cols);align-items:center;gap:2px;padding:0 6px;width:100%;text-align:left}
.th{height:28px;background:var(--deep);font-family:var(--px);font-size:12px;color:var(--muted)}
.tr{min-height:40px;background:var(--panel);border:0;border-bottom:1px solid var(--line);font-size:22px;color:var(--ink)}
button.tr{cursor:pointer}
.tr.xi{background:var(--panel2)}.tr.sel,.tr.me{background:var(--amber);color:var(--onamber)}
.tr span,.th span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .m{color:var(--muted)}.tr.sel .m,.tr.me .m,.tr.sel .amb,.tr.me .amb{color:var(--onamber)}
.n{text-align:right}
.pos{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.pos.up{background:var(--green);color:var(--deep)}.pos.dn{background:var(--red);color:var(--deep)}
.pitch{position:relative;height:320px;flex:none;border:2px solid var(--turf);overflow:hidden;background:repeating-linear-gradient(180deg,#0F3B22 0 40px,#124528 40px 80px)}
.pitch .c{position:absolute;left:50%;top:-46px;width:92px;height:92px;margin-left:-46px;border:2px solid var(--turf);border-radius:50%}
.pitch .pa{position:absolute;left:50%;bottom:0;width:180px;height:64px;margin-left:-90px;border:2px solid var(--turf);border-bottom:0}
.pitch .ga{position:absolute;left:50%;bottom:0;width:90px;height:26px;margin-left:-45px;border:2px solid var(--turf);border-bottom:0}
.pbtn{position:absolute;width:62px;height:56px;margin:-26px 0 0 -31px;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dot{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--onamber);border:2px solid var(--deep);display:flex;align-items:center;justify-content:center;font-size:20px}
.dot.gk{background:var(--blue)}.dot.off{background:var(--red)}
.pbtn.sel .dot{outline:3px solid #fff}
.nm{font-size:18px;line-height:1;text-shadow:1px 1px 0 var(--deep);white-space:nowrap;margin-top:1px}
.cyc{height:46px;flex:none;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 10px}
.cyc .v{display:flex;align-items:center}.cyc .v b{min-width:104px;text-align:center;font-weight:400;font-size:26px}
.cyc button{width:44px;height:42px;background:transparent;border:0;color:var(--amber);font-size:28px;cursor:pointer}
.bar{display:flex;height:10px;flex:1}.bar i{display:block;min-width:0}
.srow2{display:flex;align-items:center;gap:8px}.srow2 span{min-width:48px;font-size:22px;white-space:nowrap}.srow2 span:last-child{text-align:right}
.log{display:flex;flex-direction:column;font-size:21px;line-height:1.05}
.lg{display:grid;grid-template-columns:50px minmax(0,1fr);gap:4px;padding:5px 0;border-bottom:1px solid var(--line)}
.lg .m{color:var(--amber)}.lg.goal{color:var(--green)}.lg.ht{color:var(--blue)}.lg.red{color:var(--red)}
.sq{display:inline-block;width:10px;height:14px;margin-right:5px;vertical-align:-1px;background:var(--amber)}.sq.r{background:var(--red)}
.tabs{display:flex;gap:8px;flex:none}.tabs button{flex:1;height:40px;background:var(--panel);border:2px solid var(--line);color:var(--muted);font-family:var(--px);font-size:13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--amber);border-color:var(--amber);color:var(--onamber)}
.meter{height:12px;background:var(--deep);border:2px solid var(--line);flex:none}.meter i{display:block;height:100%;background:var(--green)}
.kv{display:flex;justify-content:space-between;gap:10px}.kv span:last-child{text-align:right}
textarea{width:100%;height:120px;background:var(--deep);color:var(--ink);border:2px solid var(--line);font-family:ui-monospace,monospace;font-size:13px;padding:8px;resize:vertical}
p{margin:0}
.para{display:flex;flex-direction:column;gap:8px;line-height:1.1}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}}
</style>
<div class="device" id="dev">
<div class="hdr" id="hdr"></div>
<div class="body" id="body"></div>
<div class="soft" id="soft"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="ovl" id="ovl" hidden></div>
</div>
<script>
(function(){
'use strict';
var KEY='pitchboss-save-v1';

/* ---------- utilities ---------- */
function rnd(){return Math.random();}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function gauss(){var u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function wpick(arr,wf){var t=0,w=arr.map(function(x){var v=Math.max(0.0001,wf(x));t+=v;return v;});var r=rnd()*t;for(var i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){var a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+'£'+Number((a/1e6).toFixed(2))+'M';if(a>=1e3)return s+'£'+Math.round(a/1e3)+'K';return s+'£'+a;}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function sn(name){var p=String(name).split('. ');return (p[1]||p[0]);}
function $(id){return document.getElementById(id);}

/* ---------- constants ---------- */
var CLUBS=[
 {id:'northgate',name:'Northgate Athletic',short:'Northgate Ath',abbr:'NOR',rep:9,avg:74,budget:3200000},
 {id:'silverlake',name:'Silverlake FC',short:'Silverlake FC',abbr:'SIL',rep:8,avg:72,budget:2800000},
 {id:'redmoor',name:'Redmoor Town',short:'Redmoor Town',abbr:'RED',rep:7,avg:71,budget:2400000},
 {id:'harbor',name:'Harbor Rovers',short:'Harbor Rovers',abbr:'HAR',rep:6,avg:69,budget:2400000},
 {id:'eastvale',name:'Eastvale United',short:'Eastvale Utd',abbr:'EAS',rep:6,avg:68,budget:2000000},
 {id:'brookfield',name:'Brookfield City',short:'Brookfield C.',abbr:'BRO',rep:5,avg:66,budget:1600000},
 {id:'kingsford',name:'Kingsford Wanderers',short:'Kingsford W.',abbr:'KIN',rep:5,avg:64,budget:1400000},
 {id:'dunmore',name:'Dunmore Albion',short:'Dunmore Alb.',abbr:'DUN',rep:4,avg:63,budget:1200000},
 {id:'ashgrove',name:'Ashgrove Rangers',short:'Ashgrove R.',abbr:'ASH',rep:3,avg:61,budget:900000},
 {id:'millbank',name:'Millbank Town',short:'Millbank Tn',abbr:'MIL',rep:2,avg:59,budget:700000}
];
var SURN=['Haddad','Okoro','Petrov','Dunmore','Castell','Lindqvist','Mbeki','Vance','Salcedo','Whitlock','Brandt','Ferro','Marlow','Varga','Soler','Keller','Tanaka','Moreau','Novak','Rios','Adeyemi','Fontaine','Kovac','Larsen','Quinn','Bellamy','Costa','Draper','Eklund','Farah','Grayson','Holm','Ibarra','Jansen','Kessler','Lombardi','Mensah','Nilsson','Ortega','Pruitt','Rennick','Sato','Thorne','Ulloa','Vasco','Weller','Yilmaz','Zeller','Abbott','Banerjee','Calloway','Delacroix','Estrada','Fenwick','Garrity','Hollis','Iversen','Jovanovic','Kowalski','Laurent','Maddox','Nakamura','Okafor','Pereira','Quigley','Rasmussen','Stannard','Trevino','Underhill','Valdez','Westbrook','Yamada','Zielinski'];
var INIT='ABCDEFGHIJKLMNOPRSTVWY';
var TEMPLATE=['GK','GK','DF','DF','DF','DF','DF','DF','MF','MF','MF','MF','MF','MF','MF','FW','FW','FW','FW','FW'];
var FORMATIONS={'4-4-2':[4,4,2],'4-3-3':[4,3,3],'3-5-2':[3,5,2],'5-3-2':[5,3,2],'4-5-1':[4,5,1]};
var MENT={'DEFENSIVE':{a:.95,d:1.05,t:.92},'BALANCED':{a:1,d:1,t:1},'ATTACKING':{a:1.05,d:.96,t:1.06},'ALL-OUT':{a:1.1,d:.88,t:1.14}};
var TEMPO={'SLOW':{c:.88,f:.85},'NORMAL':{c:1,f:1},'FAST':{c:1.12,f:1.25}};
var PRESS={'LOW':{c:.97,f:.85,k:.8},'MEDIUM':{c:1,f:1,k:1},'HIGH':{c:1.04,f:1.25,k:1.25}};
var SPEEDS=[{l:'x1',ms:600},{l:'x2',ms:280},{l:'x4',ms:110}];
var ROUNDS=18, MAXSQ=24, MINSQ=16;
var PRIZES=[500000,350000,250000,180000,130000,90000,60000,40000,20000,0];

/* ---------- players ---------- */
function valueOf(p){var v=Math.pow(Math.max(p.ovr-30,1)/10,3.5)*10000;if(p.age>=31)v*=0.6;else if(p.age>=29)v*=0.8;else if(p.age<=21)v*=1.3;return Math.max(5000,Math.round(v/5000)*5000);}
function recalc(p){p.value=valueOf(p);p.wage=Math.max(300,Math.round(p.value/400/100)*100);}
function uniqueName(G){for(var k=0;k<60;k++){var n=INIT.charAt(ri(0,INIT.length-1))+'. '+pick(SURN);if(!G.used[n]){G.used[n]=1;return n;}}var m=INIT.charAt(ri(0,INIT.length-1))+'. '+pick(SURN)+ri(2,9);G.used[m]=1;return m;}
function makePlayer(G,pos,avg,age){
  var p={id:'p'+(G.nextPid++),name:uniqueName(G),pos:pos,age:age||ri(18,34),ovr:clamp(Math.round(avg+gauss()*5),38,92),fit:100,injW:0,susp:0,goals:0,apps:0,yc:0,rc:0,club:null,mkt:false};
  recalc(p);G.players[p.id]=p;return p;
}
function avail(p){return p.injW<=0&&p.susp<=0;}
function posFit(pp,sp){if(pp===sp)return 1;if(pp==='GK'||sp==='GK')return .35;if((pp==='DF'&&sp==='MF')||(pp==='MF'&&sp==='DF'))return .88;if((pp==='MF'&&sp==='FW')||(pp==='FW'&&sp==='MF'))return .9;return .78;}
function pscore(p,sp){return p.ovr*posFit(p.pos,sp)*(0.75+0.25*p.fit/100);}
function slotsOf(f){var c=FORMATIONS[f],a=['GK'],i;for(i=0;i<c[0];i++)a.push('DF');for(i=0;i<c[1];i++)a.push('MF');for(i=0;i<c[2];i++)a.push('FW');return a;}
function slotCoords(f){var c=FORMATIONS[f],out=[{x:50,y:88}];var rows=[[c[0],66],[c[1],42],[c[2],15]];rows.forEach(function(r){for(var i=0;i<r[0];i++)out.push({x:Math.round((i+1)/(r[0]+1)*1000)/10,y:r[1]});});return out;}

/* ---------- lineups ---------- */
function fillBench(G,club){
  var inUse={};club.xi.forEach(function(id){inUse[id]=1;});club.bench.forEach(function(id){inUse[id]=1;});
  var rest=club.squad.map(function(id){return G.players[id];}).filter(function(p){return avail(p)&&!inUse[p.id];}).sort(function(a,b){return b.ovr-a.ovr;});
  var hasGK=club.bench.some(function(id){return G.players[id].pos==='GK';});
  if(!hasGK&&club.bench.length<7){var g=rest.filter(function(p){return p.pos==='GK';})[0];if(g){club.bench.push(g.id);rest.splice(rest.indexOf(g),1);}}
  while(club.bench.length<7&&rest.length){club.bench.push(rest.shift().id);}
}
function autoPick(G,club){
  var slots=slotsOf(club.formation);var all=club.squad.map(function(id){return G.players[id];});
  var pool=all.filter(avail),bad=all.filter(function(p){return !avail(p);});
  var xi=new Array(11),used={};
  var order=[0];slots.forEach(function(s,i){if(s==='FW')order.push(i);});slots.forEach(function(s,i){if(s==='MF')order.push(i);});slots.forEach(function(s,i){if(s==='DF')order.push(i);});
  order.forEach(function(i){
    var best=null,bs=-1;
    pool.forEach(function(p){if(used[p.id])return;var s=pscore(p,slots[i]);if(s>bs){bs=s;best=p;}});
    if(!best){bad.forEach(function(p){if(used[p.id])return;var s=pscore(p,slots[i]);if(s>bs){bs=s;best=p;}});}
    xi[i]=best.id;used[best.id]=1;
  });
  club.xi=xi;club.bench=[];fillBench(G,club);
}
function validateLineup(G,club){
  var notes=[],sq={};club.squad.forEach(function(id){sq[id]=1;});
  var slots=slotsOf(club.formation),seen={};
  var xi=club.xi.filter(function(id){if(!sq[id]||seen[id])return false;seen[id]=1;return true;});
  if(xi.length!==11||club.xi.length!==11){autoPick(G,club);notes.push('Lineup rebuilt');return notes;}
  xi.forEach(function(id,i){
    var p=G.players[id];
    if(!avail(p)){
      var cand=club.squad.map(function(x){return G.players[x];}).filter(function(q){return avail(q)&&xi.indexOf(q.id)<0;}).sort(function(a,b){return pscore(b,slots[i])-pscore(a,slots[i]);})[0];
      if(cand){notes.push(p.name+(p.injW>0?' (injured)':' (suspended)')+' replaced by '+cand.name);xi[i]=cand.id;}
    }
  });
  club.xi=xi;
  club.bench=club.bench.filter(function(id){return sq[id]&&avail(G.players[id])&&xi.indexOf(id)<0;});
  fillBench(G,club);
  return notes;
}
function teamRating(G,club){var s=0;club.xi.forEach(function(id){s+=G.players[id].ovr;});return club.xi.length?s/club.xi.length:0;}
function tactOf(c){return {ment:c.ment,tempo:c.tempo,press:c.press};}
function aiTactics(G,club,opp,isHome){var d=teamRating(G,club)-teamRating(G,opp);var ment='BALANCED';if(d>=4&&isHome)ment='ATTACKING';else if(d<=-4)ment='DEFENSIVE';return {ment:ment,tempo:'NORMAL',press:d>=3?'HIGH':'MEDIUM'};}

/* ---------- match engine ---------- */

function makeSide(G,club,t){

}
function createMatch(G,hc,ac,userId,th,ta){

}
function minLabel(M){if(M.phase===0)return (M.i<=45?M.i:'45+'+(M.i-45))+"'";if(M.phase===2||M.phase===3)return (M.i<=45?45+M.i:'90+'+(M.i-45))+"'";return "45'";}
function strengths(side,home){
  var g={GK:[],DF:[],MF:[],FW:[]};
  side.pitch.forEach(function(pm){g[pm.slot].push(pm.p.ovr*posFit(pm.p.pos,pm.slot)*(0.65+0.35*pm.fit/100));});
  function avg(a){var s=0;a.forEach(function(x){s+=x;});return a.length?s/a.length:40;}
  var gk=g.GK.length?g.GK[0]:30,d=avg(g.DF),m=avg(g.MF),f=avg(g.FW),nD=g.DF.length,nM=g.MF.length,nF=g.FW.length;
  var att=(f*nF*1.3+m*nM*0.6)/Math.max(0.1,nF*1.3+nM*0.6);

var GOALT=['heads in from a corner','finishes from the edge of the box','slots it home calmly','curls it into the top corner','smashes it in from close range','taps in at the far post','lifts it over the keeper','drives it low into the corner'];

var MISST=['{s} drags it wide','{s} sends it over the bar','{s} shoots into the side netting','{s}\'s effort is blocked by {d}','{s} hits the post','{s} fires straight at the keeper'];
function fmt(t,o){return t.replace(/\{(\w)\}/g,function(_,k){return o[k]||'';});}
function addEv(M,evs,t,m,text,side){var e={t:t,m:m,text:text,side:side};M.log.unshift(e);evs.push(e);return e;}

function doSub(M,side,offPm,onPm,lab){
  removeFromPitch(side,offPm);offPm.off=true;
  onPm.on=true;onPm.came=true;onPm.slot=offPm.slot;onPm.fit=onPm.p.fit;
  side.pitch.push(onPm);side.bench=side.bench.filter(function(x){return x!==onPm;});side.subs++;
  addEv(M,[],'sub',lab,'SUB '+side.abbr+': '+onPm.p.name+' replaces '+offPm.p.name+'.',side===M.home?0:1);
}
function bestBench(side,slot){
  var c=side.bench.filter(function(pm){return !pm.on&&!pm.off;});
  c.sort(function(a,b){var sa=(a.p.pos===slot?1000:0)+a.p.ovr,sb=(b.p.pos===slot?1000:0)+b.p.ovr;return sb-sa;});

}
function autoSub(M,side,offPm,lab){if(side.subs>=3)return false;var on=bestBench(side,offPm.slot);if(!on)return false;doSub(M,side,offPm,on,lab);return true;}
function sendOff(M,side,pm,lab,evs,why){

  addEv(M,evs,'red',lab,'RED CARD! '+pm.p.name+' ('+side.abbr+') '+why+'. '+side.abbr+' are down to '+side.pitch.length+'.',side===M.home?0:1);
  if(pm.slot==='GK'&&!side.pitch.some(function(x){return x.slot==='GK';})){var ofp=side.pitch.filter(function(x){return x.slot!=='GK';});var bg=bestBench(side,'GK');if(bg&&side.subs<3&&ofp.length){var v=ofp[ofp.length-1];doSub(M,side,v,bg,lab);bg.slot='GK';}else if(ofp.length){ofp[ofp.length-1].slot='GK';}}
}
function resolveChance(M,att,def,sa,sd,lab,evs){

  if(!shooter)return;
  var keeper=def.pitch.filter(function(pm){return pm.slot==='GK';})[0];var kn=keeper?sn(keeper.p.name):'the keeper';
  var dn=def.pitch.filter(function(pm){return pm.slot==='DF';});var dname=dn.length?sn(pick(dn).p.name):'a defender';
  var sname=sn(shooter.p.name),sideIdx=att===M.home?0:1;
  att.shots++;

  if(rnd()<0.04){

  }

    if(rnd()<g)goal(sname+' '+pick(GOALT)+'.');

function aiManage(M,side){
  if(side.isUser||M.phase!==2)return;
  var j=M.i,opp=side===M.home?M.away:M.home,si=side===M.home?0:1,diff=M.score[si]-M.score[1-si];
  if((j===12||j===24||j===34)&&side.subs<3){
    var cand=side.pitch.filter(function(pm){return pm.slot!=='GK';}).sort(function(a,b){return a.fit-b.fit;})[0];
    if(cand&&(cand.fit<76||(diff<0&&j>=24))){autoSub(M,side,cand,minLabel(M));}
  }
  if(j===28&&diff<0&&side.ment!=='ATTACKING'&&side.ment!=='ALL-OUT')side.ment='ATTACKING';
  if(j===36&&diff>0&&side.ment!=='DEFENSIVE')side.ment='DEFENSIVE';

function advance(M){

  H.pitch.forEach(function(pm){pm.min++;pm.fit=Math.max(15,pm.fit-0.14*sH.fat*(pm.slot==='GK'?0.4:1));});
  A.pitch.forEach(function(pm){pm.min++;pm.fit=Math.max(15,pm.fit-0.14*sA.fat*(pm.slot==='GK'?0.4:1));});

function runAuto(M){var g=0;M.auto=true;while(M.phase!==3&&g++<400)advance(M);M.auto=false;M.forced=null;}

/* ---------- league ---------- */
function makeFixtures(ids){
  var n=ids.length,arr=shuffle(ids.slice()),rounds=[];
  for(var r=0;r<n-1;r++){var m=[];for(var i=0;i<n/2;i++){var a=arr[i],b=arr[n-1-i];if((r+i)%2===0)m.push({h:a,a:b});else m.push({h:b,a:a});}rounds.push(m);arr.splice(1,0,arr.pop());}
  var second=rounds.map(function(rd){return rd.map(function(f){return {h:f.a,a:f.h};});});
  return rounds.concat(second);
}
function sortedTable(G){

}
function applyResult(G,rec){
  var h=G.table[rec.h],a=G.table[rec.a];h.p++;a.p++;h.gf+=rec.hg;h.ga+=rec.ag;a.gf+=rec.ag;a.ga+=rec.hg;
  if(rec.hg>rec.ag){h.w++;h.pts+=3;a.l++;}else if(rec.hg<rec.ag){a.w++;a.pts+=3;h.l++;}else{h.d++;a.d++;h.pts++;a.pts++;}
}
function userFix(G){var fx=G.fixtures[G.round-1];if(!fx)return null;for(var i=0;i<fx.length;i++){if(fx[i].h===G.userId||fx[i].a===G.userId)return fx[i];}return null;}
function userResults(G){
  var out=[];for(var r=0;r<G.results.length;r++){(G.results[r]||[]).forEach(function(x){if(x.h===G.userId||x.a===G.userId){var home=x.h===G.userId,gf=home?x.hg:x.ag,ga=home?x.ag:x.hg;out.push({round:r+1,opp:home?x.a:x.h,home:home,gf:gf,ga:ga,res:gf>ga?'W':gf<ga?'L':'D'});}});}
  return out;
}
function addMsg(G,title,body){G.inbox.unshift({id:G.nextMsg++,round:G.round,title:title,body:body,read:false});if(G.inbox.length>40)G.inbox.length=40;}
function makeObjective(G){
  var ranked=Object.keys(G.clubs).map(function(id){return {id:id,r:teamRating(G,G.clubs[id])};}).sort(function(a,b){return b.r-a.r;});
  var idx=ranked.findIndex(function(x){return x.id===G.userId;});

}
function refreshMarket(G){
  G.market.forEach(function(id){delete G.players[id];});G.market=[];
  var uc=G.clubs[G.userId];
  ['GK','DF','DF','DF','MF','MF','MF','FW','FW','FW','MF','DF'].forEach(function(pos){
    var p=makePlayer(G,pos,uc.avg+ri(-7,8),ri(18,33));p.mkt=true;p.price=Math.round(p.value*1.2/5000)*5000;G.market.push(p.id);
  });
}
function newGame(userId){
  var G={v:1,season:2026,round:1,phase:'play',userId:userId,nextPid:1,nextMsg:1,used:{},clubs:{},players:{},fixtures:[],results:[],table:{},inbox:[],market:[],board:{conf:60,obj:null},fin:{last:null},history:[],end:null};
  var forms=Object.keys(FORMATIONS);
  CLUBS.forEach(function(c){
    var club={id:c.id,name:c.name,short:c.short,abbr:c.abbr,rep:c.rep,avg:c.avg,budget:c.budget,formation:c.id===userId?'4-4-2':pick(forms),ment:'BALANCED',tempo:'NORMAL',press:'MEDIUM',squad:[],xi:[],bench:[]};

/* ---------- round processing ---------- */
function finalize(G,M){
  var rec={h:M.home.id,a:M.away.id,hg:M.score[0],ag:M.score[1],goals:M.goals.slice(),cards:[],injs:[]};
  [M.home,M.away].forEach(function(side,si){
    side.all.forEach(function(pm){
      var p=pm.p;
      if(pm.min>0||pm.came){
        p.apps++;p.fit=Math.round(pm.fit);p.goals+=pm.goals;
        if(pm.yc>0){p.yc+=1;}
        if(pm.red){p.rc++;p.susp=1;rec.cards.push({name:p.name,side:si,red:true});}
        else if(pm.yc>0)rec.cards.push({name:p.name,side:si,red:false});
      }
      if(pm.inj){var w=rnd()<0.1?ri(7,14):ri(1,6);p.injW=w;rec.injs.push({id:p.id,name:p.name,weeks:w,side:si});}
    });
  });
  return rec;
}
function matchMsg(G,rec){
  var h=G.clubs[rec.h],a=G.clubs[rec.a],uh=rec.h===G.userId,gf=uh?rec.hg:rec.ag,ga=uh?rec.ag:rec.hg;
  var res=gf>ga?'WIN':gf<ga?'DEFEAT':'DRAW';
  var lines=[h.name+' '+rec.hg+'-'+rec.ag+' '+a.name,''];
  if(rec.goals.length){lines.push('Goals: '+rec.goals.map(function(g){return g.name+' '+g.label;}).join(', '));}
  rec.cards.forEach(function(c){if(c.red)lines.push('Red card: '+c.name+' (one-match ban).');});
  rec.injs.forEach(function(x){if((x.side===0)===uh)lines.push('Injury: '+x.name+' is out for '+x.weeks+' week'+(x.weeks>1?'s':'')+'.');});
  return {title:res+': '+h.abbr+' '+rec.hg+'-'+rec.ag+' '+a.abbr,body:lines.join('\n')};
}
function commitRound(G,userM){
  var r=G.round-1,fx=G.fixtures[r],ms=[],recs=[],uc=G.clubs[G.userId];
  fx.forEach(function(f){
    if(f.h===G.userId||f.a===G.userId){ms.push(userM);return;}
    var hc=G.clubs[f.h],ac=G.clubs[f.a];autoPick(G,hc);autoPick(G,ac);
    var M=createMatch(G,hc,ac,G.userId,aiTactics(G,hc,ac,true),aiTactics(G,ac,hc,false));runAuto(M);ms.push(M);
  });
  Object.keys(G.players).forEach(function(id){var p=G.players[id];if(p.injW>0)p.injW--;if(p.susp>0)p.susp--;});
  var userRec=null;
  ms.forEach(function(M){var rec=finalize(G,M);recs.push(rec);applyResult(G,rec);if(rec.h===G.userId||rec.a===G.userId)userRec=rec;});
  G.results[r]=recs;
  Object.keys(G.players).forEach(function(id){var p=G.players[id];if(!p.mkt&&p.club)p.fit=Math.min(100,p.fit+12+(p.age<=25?2:0));});
  var home=userRec.h===G.userId,gf=home?userRec.hg:userRec.ag,ga=home?userRec.ag:userRec.hg;
  var wages=0;uc.squad.forEach(function(id){wages+=G.players[id].wage;});
  var gate=home?Math.round((50000+uc.rep*3500)*(0.9+rnd()*0.2)):0,tv=20000;
  uc.budget+=gate+tv-wages;G.fin.last={gate:gate,tv:tv,wages:wages,home:home};
  var oppC=G.clubs[home?userRec.a:userRec.h],gap=teamRating(G,oppC)-teamRating(G,uc)>3;
  G.board.conf=clamp(G.board.conf+(gf>ga?(gap?3:2):gf<ga?(gap?-1:-2):(gap?1:0)),0,100);
  var mm=matchMsg(G,userRec);addMsg(G,mm.title,mm.body);
  G.round++;
  var out={recs:recs,userRec:userRec,fin:G.fin.last,seasonOver:false};
  if(G.round>ROUNDS){endSeason(G);out.seasonOver=true;}else{refreshMarket(G);}
  saveGame();
  return out;
}
function endSeason(G){
  var T=sortedTable(G),pos=T.findIndex(function(x){return x.id===G.userId;})+1,champ=G.clubs[T[0].id];
  var prize=PRIZES[pos-1],uc=G.clubs[G.userId];uc.budget+=prize;
  var ok=pos<=G.board.obj.pos;G.board.conf=clamp(G.board.conf+(ok?15:-15),0,100);
  var sacked=G.board.conf<10;
  G.end={pos:pos,champ:champ.name,prize:prize,ok:ok,sacked:sacked,obj:G.board.obj.text,season:G.season};
  G.history.push({season:G.season,pos:pos,champ:champ.name});
  G.phase=sacked?'sacked':'seasonend';
  addMsg(G,'Season '+G.season+'/'+String(G.season+1).slice(2)+' review','You finished '+ord(pos)+'. '+champ.name+' won the league.\nPrize money: '+money(prize)+'.\n'+(ok?'The board is pleased: objective met.':'The board is unhappy: objective missed.')+(sacked?'\n\nThe board has dismissed you.':''));

function nextSeason(G){
  var uc=G.clubs[G.userId];
  Object.keys(G.players).forEach(function(id){
    var p=G.players[id];if(p.mkt)return;
    p.age++;var d;
    if(p.age<=22)d=ri(1,5);else if(p.age<=26)d=ri(-1,3);else if(p.age<=30)d=ri(-2,1);else if(p.age<=33)d=ri(-4,0);else d=-ri(1,5);
    p.ovr=clamp(p.ovr+d,35,92);recalc(p);p.fit=100;p.injW=0;p.susp=0;p.goals=0;p.apps=0;p.yc=0;p.rc=0;
  });

  Object.keys(G.clubs).forEach(function(cid){
    var c=G.clubs[cid];
    c.squad=c.squad.filter(function(id){var p=G.players[id];var ret=p.age>=36||(p.age>=34&&p.ovr<55&&rnd()<0.6);if(ret){if(cid===G.userId)retired.push(p.name);delete G.players[id];return false;}return true;});
    var need={GK:2,DF:6,MF:6,FW:4};
    Object.keys(need).forEach(function(pos){var n=c.squad.filter(function(id){return G.players[id].pos===pos;}).length;while(n<need[pos]){var p=makePlayer(G,pos,c.avg-6,ri(17,20));p.club=cid;c.squad.push(p.id);n++;}});
    if(cid!==G.userId){while(c.squad.length>MAXSQ){var low=c.squad.map(function(id){return G.players[id];}).sort(function(a,b){return a.ovr-b.ovr;})[0];c.squad.splice(c.squad.indexOf(low.id),1);delete G.players[low.id];}}
  });
  G.season++;G.round=1;G.results=[];
  Object.keys(G.table).forEach(function(id){G.table[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
  G.fixtures=makeFixtures(CLUBS.map(function(c){return c.id;}));
  Object.keys(G.clubs).forEach(function(id){autoPick(G,G.clubs[id]);});
  G.board.obj=makeObjective(G);G.phase='play';G.end=null;

/* ---------- transfers ---------- */
function buyPlayer(G,id){
  var uc=G.clubs[G.userId],p=G.players[id];
  if(!p||!p.mkt)return 'That player is no longer available.';
  if(uc.squad.length>=MAXSQ)return 'Squad is full ('+MAXSQ+').';
  if(uc.budget<p.price)return 'Not enough budget.';
  uc.budget-=p.price;p.mkt=false;p.club=G.userId;uc.squad.push(p.id);G.market=G.market.filter(function(x){return x!==id;});
  addMsg(G,'Signing: '+p.name,p.name+' joined for '+money(p.price)+'.');
  return null;
}
function sellPlayer(G,id){
  var uc=G.clubs[G.userId],p=G.players[id];
  if(!p||uc.squad.indexOf(id)<0)return 'Not in your squad.';
  if(uc.squad.length<=MINSQ)return 'You need at least '+MINSQ+' players.';
  if(p.pos==='GK'&&uc.squad.filter(function(x){return G.players[x].pos==='GK';}).length<=2)return 'You need at least two goalkeepers.';
  var fee=Math.round(p.value*0.85/5000)*5000;
  uc.budget+=fee;uc.squad.splice(uc.squad.indexOf(id),1);uc.xi=uc.xi.filter(function(x){return x!==id;});uc.bench=uc.bench.filter(function(x){return x!==id;});
  delete G.players[id];validateLineup(G,uc);
  addMsg(G,'Sale: '+p.name,p.name+' left for '+money(fee)+'.');
  return null;
}

  function cmp(lab,x,y){var t=x+y;return '<div style="display:flex;flex-direction:column;gap:2px"><div class="lbl" style="text-align:center">'+lab+'</div><div class="srow2"><span>'+Math.round(x)+'</span><div class="bar"><i style="flex:'+x+';background:var(--green)"></i><i style="flex:'+y+';background:var(--blue)"></i></div><span>'+Math.round(y)+'</span></div></div>';}
  var h='<div class="card"><div class="lbl">ROUND '+G.round+'/'+ROUNDS+' - '+(ni.home?'HOME':'AWAY')+'</div><div class="big">'+esc(uc.short)+' v '+esc(oc.short)+'</div></div>';
  h+='<div class="card">'+cmp('ATTACK',a.att,b.att)+cmp('MIDFIELD',a.ctl,b.ctl)+cmp('DEFENCE',a.def,b.def)+'<div class="mut" style="font-size:20px;text-align:center">Green: your XI. Blue: '+esc(oc.short)+'.</div></div>';
  var hurt=uc.squad.map(function(id){return G.players[id];}).filter(function(q){return !avail(q);});
  if(hurt.length)h+='<div class="card"><div class="lbl">UNAVAILABLE</div>'+hurt.map(function(q){return '<div class="red">'+esc(q.name)+' - '+(q.injW>0?'injured '+q.injW+' wk':'suspended')+'</div>';}).join('')+'</div>';
  h+='<button type="button" class="btnbig" data-act="kickoff">KICK OFF</button><button type="button" class="btnbig alt" data-act="go" data-to="tactics">TACTICS AND LINEUP</button>';
  return {title:'MATCH DAY',right:'PREVIEW',body:h};
};
SCREENS.match=function(){
  if(!M)return {title:'MATCH DAY',body:'<div class="mut">No match in progress.</div>',soft:[{l:'BACK',a:'toHub'}]};
  var body='<div class="card dark" style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:10px 8px"><div style="text-align:center;font-size:24px;line-height:1">'+esc(M.home.name.toUpperCase())+'</div><div class="huge" id="msc">0-0</div><div style="text-align:center;font-size:24px;line-height:1">'+esc(M.away.name.toUpperCase())+'</div></div>'+
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:20px;line-height:1;margin-top:-4px"><div class="mut" id="mgh"></div><div class="mut" id="mga" style="text-align:right"></div></div>'+
   '<div class="card" id="mst"></div><div class="lbl">COMMENTARY</div><div class="log" id="mlog"></div>';
  return {title:'MATCH DAY',right:'<span id="mmin">0\'</span>',body:body,softHtml:matchSoft()};
};
function matchSoft(){
  if(M&&M.phase===3)return '<div class="srow"><button type="button" class="r" data-act="mDone">CONTINUE &gt;&gt;</button></div>';
  return '<div class="srow"><button type="button" class="l" data-act="mPlay" id="bPlay">PAUSE</button><button type="button" class="c" data-act="mSpeed" id="bSpd">'+SPEEDS[speedIdx].l+'</button><button type="button" class="r" data-act="mSkip">SKIP &gt;&gt;</button></div><div class="srow"><button type="button" class="l" data-act="mSubs">SUBS</button><button type="button" class="r" data-act="mTact">TACTICS</button></div>';
}
SCREENS.post=function(p){
  var res=p.res,ur=res.userRec,uh=ur.h===G.userId,gf=uh?ur.hg:ur.ag,ga=uh?ur.ag:ur.hg;
  var h='<div class="card dark"><div class="lbl">FULL TIME</div><div class="kv" style="font-size:26px"><span>'+esc(G.clubs[ur.h].short)+'</span><span class="huge" style="font-size:30px">'+ur.hg+'-'+ur.ag+'</span><span>'+esc(G.clubs[ur.a].short)+'</span></div><div class="'+(gf>ga?'grn':gf<ga?'red':'amb')+'" style="text-align:center;font-size:26px">'+(gf>ga?'WIN':gf<ga?'DEFEAT':'DRAW')+'</div></div>';
  var lines=[];ur.goals.forEach(function(g){lines.push('<div><span class="amb">'+g.label+'</span> '+esc(g.name)+' <span class="mut">('+(g.side===0?G.clubs[ur.h].abbr:G.clubs[ur.a].abbr)+')</span></div>');});

  var rows='<div class="tbl">';

SCREENS.seasonend=function(){

  h+=tableRowsHtml(sortedTable(G));
  h+='<div class="card"><div class="kv"><span class="mut">Objective</span><span>'+esc(e.obj)+'</span></div><div class="kv"><span class="mut">Result</span><span class="'+(e.ok?'grn':'red')+'">'+(e.ok?'Met':'Missed')+'</span></div><div class="kv"><span class="mut">Prize money</span><span class="amb">'+money(e.prize)+'</span></div><div class="kv"><span class="mut">Board confidence</span><span>'+G.board.conf+'%</span></div></div>';
  h+=G.phase==='sacked'?'<div class="card"><div class="red">The board has dismissed you.</div></div><button type="button" class="btnbig" data-act="toMenu">BACK TO MENU</button>':'<button type="button" class="btnbig" data-act="nextSeason">START NEXT SEASON</button>';
  return {title:'SEASON REVIEW',body:h,soft:null};

SCREENS.help=function(){

};
SCREENS.backup=function(p){

/* ---------- rendering ---------- */
function render(top){
  var c=stack[stack.length-1],d=SCREENS[c.n](c.p||(c.p={}));
  var hd=$('hdr');hd.hidden=!!d.nohdr;hd.innerHTML='<span>'+d.title+'</span><span>'+(d.right||'')+'</span>';
  var b=$('body'),sc=b.scrollTop;b.innerHTML=d.body;b.scrollTop=top?0:sc;
  var s=$('soft');
  if(d.softHtml!=null){s.className='soft col';s.innerHTML=d.softHtml;s.hidden=false;}
  else{var items=d.soft===undefined?[{l:'BACK',a:'back'}]:d.soft;if(items){s.className='soft';s.innerHTML=softHtml(items);s.hidden=false;}else{s.hidden=true;s.innerHTML='';}}
  if(c.n==='match'){matchUpdate();updPlay();}
}
function go(n,p){selId=null;stack.push({n:n,p:p||{}});render(true);}
function back(){if(stack.length>1){stack.pop();selId=null;render(true);}}
function resetTo(arr){stack=arr;selId=null;render(true);}

/* ---------- live match ui ---------- */
function updPlay(){var b=$('bPlay');if(!b||!M)return;b.textContent=M.phase===1?'2ND HALF':running?'PAUSE':'PLAY';var s=$('bSpd');if(s)s.textContent=SPEEDS[speedIdx].l;}
function matchUpdate(){
  if(!M||!$('mmin'))return;
  $('mmin').textContent=M.phase===1?'HT':M.phase===3?'FT':minLabel(M);
  $('msc').textContent=M.score[0]+'-'+M.score[1];
  function gl(si){return M.goals.filter(function(g){return g.side===si;}).map(function(g){return esc(g.name)+' '+g.label;}).join(', ');}
  $('mgh').textContent='';$('mgh').innerHTML=gl(0);$('mga').innerHTML=gl(1);
  var H=M.home,A=M.away,tot=Math.max(1,H.poss+A.poss),hp=Math.round(100*H.poss/tot);
  function row(l,x,y,xs,ys){return '<div style="display:flex;flex-direction:column;gap:2px"><div class="lbl" style="text-align:center">'+l+'</div><div class="srow2"><span>'+xs+'</span><div class="bar"><i style="flex:'+Math.max(x,0.01)+';background:var(--green)"></i><i style="flex:'+Math.max(y,0.01)+';background:var(--blue)"></i></div><span>'+ys+'</span></div></div>';}
  $('mst').innerHTML=row('POSSESSION',hp,100-hp,hp+'%',(100-hp)+'%')+row('SHOTS (ON TARGET)',H.shots,A.shots,H.shots+' ('+H.sot+')',A.shots+' ('+A.sot+')');
  $('mlog').innerHTML=M.log.map(function(e){
    var cls=e.t==='goal'?' goal':e.t==='ht'||e.t==='ko'?' ht':e.t==='red'||e.t==='inj'?' red':'';
    var icon=e.t==='yellow'?'<i class="sq"></i>':e.t==='red'?'<i class="sq r"></i>':'';
    return '<div class="lg'+cls+'"><span class="m">'+esc(e.m)+'</span><span>'+icon+esc(e.text)+'</span></div>';
  }).join('');
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}running=false;updPlay();}
function runTimer(){stopTimer();if(!M||M.phase===3)return;running=true;timer=setInterval(tick,SPEEDS[speedIdx].ms);updPlay();}
function tick(){
  advance(M);matchUpdate();updPlay();
  if(M.forced){stopTimer();wasRun=true;openSubs();return;}
  if(M.phase===1){stopTimer();}
  else if(M.phase===3){stopTimer();$('soft').innerHTML=matchSoft();}
}
function pmById(side,id){return side.all.filter(function(pm){return pm.p.id===id;})[0];}
function showOvl(title,body,closeLabel){
  var o=$('ovl');o.hidden=false;
  o.innerHTML='<div class="hdr"><span>'+title+'</span><span></span></div><div class="ovb">'+body+'</div><div class="soft"><button type="button" class="r" data-act="ovClose">'+(closeLabel||'CLOSE')+'</button></div>';
}
function hideOvl(){$('ovl').hidden=true;$('ovl').innerHTML='';ov=null;}
function openSubs(){
  if(!M)return;
  if(!M.forced&&!ov){wasRun=running;stopTimer();}
  ov=ov||{off:null};
  var side=M.userSide,cols='34px minmax(0,1fr) 42px 36px',h='';
  function benchList(offPm){var l=side.bench.filter(function(pm){return !pm.on&&!pm.off;});if(!l.length)return '<div class="mut">Bench is empty.</div>';var s='<div class="tbl">';l.forEach(function(pm){s+='<button type="button" class="tr" style="--cols:'+cols+'" data-act="subOn" data-id="'+pm.p.id+'"><span class="m">'+pm.p.pos+'</span><span>'+esc(pm.p.name)+'</span><span class="grn n">'+Math.round(pm.fit)+'</span><span class="n">'+pm.p.ovr+'</span></button>';});return s+'</div>';}
  if(M.forced){h='<div class="card"><div class="lbl">INJURY</div><div class="red">'+esc(M.forced.pm.p.name)+' cannot continue. Choose a replacement.</div></div>'+benchList();showOvl('SUBSTITUTION',h,'PLAY ON');return;}
  if(side.subs>=3){showOvl('SUBSTITUTIONS','<div class="card"><div>No substitutions left (3/3 used).</div></div>');return;}
  if(!ov.off){
    h='<div class="lbl">SUBS USED '+side.subs+'/3 - TAP THE PLAYER TO TAKE OFF</div><div class="tbl">';
    side.pitch.forEach(function(pm){h+='<button type="button" class="tr" style="--cols:'+cols+'" data-act="subOff" data-id="'+pm.p.id+'"><span class="m">'+pm.slot+'</span><span>'+esc(pm.p.name)+'</span><span class="'+(pm.fit>=75?'amb':'red')+' n">'+Math.round(pm.fit)+'</span><span class="n">'+pm.p.ovr+'</span></button>';});
    h+='</div>';showOvl('SUBSTITUTIONS',h);return;
  }
  var off=pmById(side,ov.off);
  h='<div class="card"><div class="lbl">OFF</div><div>'+esc(off.p.name)+' ('+off.slot+')</div></div><div class="lbl">TAP THE REPLACEMENT</div>'+benchList(off);
  showOvl('SUBSTITUTIONS',h);
}
function openMatchTactics(){
  if(!M)return;wasRun=running;stopTimer();
  var s=M.userSide;
  function row(label,key,val){return '<div class="cyc"><span class="lbl">'+label+'</span><span class="v"><button type="button" aria-label="Previous '+label.toLowerCase()+'" data-act="mcyc" data-k="'+key+'" data-dir="-1">&lt;</button><b>'+val+'</b><button type="button" aria-label="Next '+label.toLowerCase()+'" data-act="mcyc" data-k="'+key+'" data-dir="1">&gt;</button></span></div>';}
  ov={tact:true};
  showOvl('TACTICS',row('MENTALITY','ment',s.ment)+row('TEMPO','tempo',s.tempo)+row('PRESSING','press',s.press)+'<div class="mut" style="font-size:20px">Attacking play creates more chances for both teams. High pressing and fast tempo tire players quicker.</div>');
}
function finishMatch(){
  stopTimer();var res=commitRound(G,M);M=null;
  resetTo([{n:'hub',p:{}},{n:'post',p:{res:res}}]);
}

/* ---------- actions ---------- */
function cycle(obj,k,dir){
  var lists={formation:Object.keys(FORMATIONS),ment:Object.keys(MENT),tempo:Object.keys(TEMPO),press:Object.keys(PRESS)},l=lists[k],i=l.indexOf(obj[k]);
  obj[k]=l[(i+dir+l.length)%l.length];
}
var ACT={
  continue:function(){var g=readSave();if(!g){toast('No save found.');return;}G=g;resetTo([{n:'hub',p:{}}]);},
  go:function(d){go(d.to);},
  back:function(){back();},
  toHub:function(){resetTo([{n:'hub',p:{}}]);},
  toMenu:function(){stopTimer();saveGame();M=null;resetTo([{n:'menu',p:{}}]);},
  pickClub:function(d){var c=stack[stack.length-1];c.p.sel=d.id;render(false);},
  startCareer:function(d){G=newGame(d.id);saveGame();resetTo([{n:'hub',p:{}}]);},
  save:function(){saveGame();toast('Game saved.');},
  play:function(){if(G.round>ROUNDS){go('seasonend');return;}go('prematch');},
  kickoff:function(){
    var ni=nextInfo(),uc=UC(),oc=ni.opp,hc=ni.home?uc:oc,ac=ni.home?oc:uc;
    validateLineup(G,uc);autoPick(G,oc);
    M=createMatch(G,hc,ac,G.userId,ni.home?tactOf(uc):aiTactics(G,hc,ac,true),ni.home?aiTactics(G,ac,hc,false):tactOf(uc));
    M.userSide=ni.home?M.home:M.away;
    M.log.unshift({t:'ko',m:"0'",text:'KICK OFF. '+hc.name+' v '+ac.name+'.',side:null});
    ov=null;speedIdx=1;resetTo([{n:'hub',p:{}},{n:'match',p:{}}]);runTimer();
  },
  mPlay:function(){if(!M)return;if(M.phase===3)return;if(running)stopTimer();else runTimer();},
  mSpeed:function(){speedIdx=(speedIdx+1)%SPEEDS.length;if(running)runTimer();updPlay();},
  mSkip:function(){if(!M)return;stopTimer();hideOvl();runAuto(M);matchUpdate();$('soft').innerHTML=matchSoft();},
  mSubs:function(){ov=null;openSubs();},
  mTact:function(){openMatchTactics();},
  mDone:function(){finishMatch();},
  subOff:function(d){ov.off=d.id;openSubs();},
  subOn:function(d){
    var side=M.userSide,on=pmById(side,d.id),off=M.forced?M.forced.pm:pmById(side,ov.off);
    if(!on||!off)return;
    doSub(M,side,off,on,minLabel(M));M.forced=null;hideOvl();matchUpdate();
    if(wasRun)runTimer();
  },
  ovClose:function(){
    var wasForced=!!M.forced;M.forced=null;hideOvl();
    if(M&&M.phase!==3&&(wasRun||wasForced))runTimer();
  },
  mcyc:function(d){var s=M.userSide;cycle(s,d.k,+d.dir);var c=UC();c[d.k]=s[d.k];openMatchTactics();},
  postDone:function(){var c=stack[stack.length-1];if(c.p.res.seasonOver)resetTo([{n:'hub',p:{}},{n:'seasonend',p:{}}]);else resetTo([{n:'hub',p:{}}]);},
  nextSeason:function(){nextSeason(G);saveGame();resetTo([{n:'hub',p:{}}]);},
  openMsg:function(d){var m=G.inbox.filter(function(x){return String(x.id)===d.id;})[0];if(m)m.read=true;go('msg',{id:m?m.id:0});},
  sortSquad:function(){var c=stack[stack.length-1],o=['pos','rat','fit','gls'];c.p.sort=o[(o.indexOf(c.p.sort||'pos')+1)%o.length];render(false);},
  openPlayer:function(d){go('player',{id:d.id});},
  sell:function(d){var c=stack[stack.length-1];c.p.confirm=true;render(false);},
  sellYes:function(d){var e=sellPlayer(G,d.id);if(e){toast(e);var c=stack[stack.length-1];c.p.confirm=false;render(false);return;}saveGame();toast('Player sold.');stack.pop();render(true);},
  buy:function(d){var e=buyPlayer(G,d.id);if(e){toast(e);return;}validateLineup(G,UC());saveGame();toast('Player signed.');stack.pop();render(true);},
  tab:function(d){var c=stack[stack.length-1];c.p.tab=d.t;render(false);},
  cyc:function(d){var c=UC();cycle(c,d.k,+d.dir);if(d.k==='formation'){autoPick(G,c);selId=null;toast('Lineup picked for '+c.formation+'.');}saveGame();render(false);},
  autoPick:function(){autoPick(G,UC());selId=null;saveGame();toast('Best XI picked.');render(false);},
  selP:function(d){
    var c=UC(),id=d.id;
    if(!selId){selId=id;render(false);return;}
    if(selId===id){selId=null;render(false);return;}
    var A=G.players[selId],B=G.players[id];
    function loc(x){var i=c.xi.indexOf(x);if(i>=0)return {l:'xi',i:i};i=c.bench.indexOf(x);if(i>=0)return {l:'b',i:i};return {l:'r',i:-1};}
    var la=loc(selId),lb=loc(id);
    if(la.l==='r'&&lb.l==='r'){selId=null;render(false);return;}
    if((lb.l!=='r'&&!avail(A))||(la.l!=='r'&&!avail(B))){toast((!avail(A)&&lb.l!=='r'?A.name:B.name)+' is not available.');selId=null;render(false);return;}
    function set(l,i,v){if(l==='xi')c.xi[i]=v;else if(l==='b')c.bench[i]=v;}
    set(la.l,la.i,id);set(lb.l,lb.i,selId);
    selId=null;saveGame();render(false);
  },
  exportBk:function(){var g=G||readSave();if(!g){toast('Nothing to export yet.');return;}var c=stack[stack.length-1];c.p.out=JSON.stringify(g);render(false);},
  copyBk:function(){var t=$('bkOut');if(!t)return;var done=function(){toast('Copied.');};try{navigator.clipboard.writeText(t.value).then(done,function(){t.select();toast('Press copy on your keyboard.');});}catch(e){t.select();toast('Select and copy the code.');}},
  loadBk:function(){var t=$('bkIn');if(!t||!t.value.trim()){toast('Paste a save code first.');return;}try{var g=JSON.parse(t.value.trim());if(!(g&&g.v===1&&g.clubs&&g.players&&g.fixtures))throw new Error('bad');G=g;saveGame();toast('Save restored.');resetTo([{n:'hub',p:{}}]);}catch(e){toast('That code is not a valid save.');}}
};
function onClick(e){var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t||t.disabled)return;var a=t.getAttribute('data-act');if(ACT[a]){var d={};for(var i=0;i<t.attributes.length;i++){var at=t.attributes[i];if(at.name.indexOf('data-')===0)d[at.name.slice(5)]=at.value;}ACT[a](d,t);}}

/* ---------- boot ---------- */
function boot(data){
  document.addEventListener('click',onClick);
  if(data&&data.g){G=data.g;stack=data.stack&&data.stack.length?data.stack.filter(function(s){return s.n!=='match'&&s.n!=='post';}):[{n:'menu',p:{}}];if(!stack.length)stack=[{n:'menu',p:{}}];}
  try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {g:G,stack:stack};});}catch(e){}
  render(true);
}
if(typeof module!=='undefined'&&module.exports){
  module.exports={newGame:newGame,createMatch:createMatch,advance:advance,runAuto:runAuto,commitRound:commitRound,nextSeason:nextSeason,autoPick:autoPick,validateLineup:validateLineup,sortedTable:sortedTable,aiTactics:aiTactics,tactOf:tactOf,userFix:userFix,buyPlayer:buyPlayer,sellPlayer:sellPlayer,SCREENS:SCREENS,setG:function(g){G=g;},getG:function(){return G;},setM:function(m){M=m;},getM:function(){return M;},stackSet:function(s){stack=s;},ACT:ACT,doSub:doSub,TEMPLATE:TEMPLATE,FORMATIONS:FORMATIONS,ROUNDS:ROUNDS,money:money};
}else{
  var start=function(d){boot(d);};
  try{if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}catch(e){start({});}
}
})();
