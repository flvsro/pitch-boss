<style>
/* Layout: one phone-shaped column (header bar, scrolling body, soft-key bar), like a 2000s Java handset game. Single dark pitch-green look by design. */
:root{
  --bg:#0A1A10; --deep:#04110A; --panel:#0F2A1B; --panel2:#123524; --line:#1E4D32; --line2:#2E6B47;
  --ink:#E6F4EA; --muted:#9FCBAE; --green:#3DDC84; --amber:#F2C94C; --red:#FF8A8A; --blue:#6EC1FF; --onamber:#1A1200;
  --turf:#5BBF85;
  --px:'Silkscreen',ui-monospace,monospace; --tx:'VT323',ui-monospace,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--tx);font-size:22px;display:flex;justify-content:center}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.device{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media (min-width:640px) and (min-height:760px){.device{height:min(100%,820px);align-self:center;border:3px solid var(--line2);box-shadow:6px 6px 0 var(--deep)}}
.hdr{flex:none;height:56px;background:var(--green);color:var(--deep);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 var(--gr) 0 var(--gl);font-family:var(--px);font-weight:700;font-size:16px;letter-spacing:1px}
.hdr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px var(--gr) 14px var(--gl);display:flex;flex-direction:column;gap:10px}
.soft{flex:none;min-height:52px;background:var(--panel2);border-top:2px solid var(--line2);display:flex;padding:0 var(--gr) 0 var(--gl)}
.soft.col{flex-direction:column;padding-top:0}
.soft button{flex:1;min-height:50px;background:transparent;border:0;color:var(--amber);font-family:var(--px);font-weight:700;font-size:14px;cursor:pointer;padding:0 6px;letter-spacing:.5px}
.soft button.l{text-align:left}.soft button.r{text-align:right}.soft button.c{text-align:center}
.srow{display:flex;min-height:46px}.srow button{min-height:46px}
.toast{pointer-events:none;position:absolute;left:var(--gl);right:var(--gr);bottom:68px;background:var(--amber);color:var(--onamber);padding:8px 12px;font-size:22px;z-index:8;box-shadow:3px 3px 0 var(--deep)}
.ovl{position:absolute;inset:0;background:#04110A;z-index:6;display:flex;flex-direction:column}
.ovb{flex:1;min-height:0;overflow-y:auto;padding:12px var(--gr) 14px var(--gl);display:flex;flex-direction:column;gap:8px}
.hero{flex:none;height:210px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#0F3B22 0 30px,#124528 30px 60px);border-bottom:3px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:-12px calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.hero .ln{position:absolute;left:0;right:0;top:50%;height:2px;background:#2E8B57}
.hero .ci{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border:2px solid #2E8B57;border-radius:50%}
.hero .ball{position:relative;width:42px;height:42px;border-radius:50%;background:var(--ink);border:3px solid var(--deep);display:flex;align-items:center;justify-content:center}
.hero .ball i{width:15px;height:15px;background:var(--deep);transform:rotate(45deg)}
.hero .ti{position:relative;display:flex;flex-direction:column;align-items:center;font-family:var(--px);font-weight:700;font-size:42px;line-height:1;letter-spacing:2px;text-shadow:3px 3px 0 var(--deep)}
.hero .sub{position:relative;background:var(--deep);padding:2px 10px;font-size:22px;letter-spacing:1px}
.mbtn{height:46px;width:100%;flex:none;background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:26px;text-align:left;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;box-shadow:3px 3px 0 var(--deep)}
.mbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn.sm{font-size:24px}
.mbtn.sel{background:var(--amber);border-color:var(--amber);color:var(--onamber)}
.mbtn .r{color:var(--muted);flex:none}.mbtn.sel .r{color:var(--onamber)}
.badge{background:var(--amber);color:var(--onamber);min-width:22px;height:22px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:20px}
.card{background:var(--panel);border:2px solid var(--line);padding:10px 12px;box-shadow:3px 3px 0 var(--deep);display:flex;flex-direction:column;gap:4px;flex:none}
.card.dark{background:var(--deep)}
.lbl{font-family:var(--px);font-size:12px;color:var(--muted);letter-spacing:1px}
.big{font-size:32px;line-height:1}.huge{font-family:var(--px);font-weight:700;font-size:34px;color:var(--amber);letter-spacing:2px}
.mut{color:var(--muted)}.amb{color:var(--amber)}.grn{color:var(--green)}.red{color:var(--red)}.blu{color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.stat{background:var(--panel);border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-weight:400;font-size:28px;line-height:1;color:var(--amber)}
.fl{display:flex;gap:6px;align-items:center}
.fl i{font-style:normal;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--deep);font-size:22px}
.W{background:var(--green)}.D{background:var(--muted)}.L{background:var(--red)}
.btnbig{height:52px;width:100%;flex:none;background:var(--amber);border:2px solid var(--amber);color:var(--onamber);font-family:var(--px);font-weight:700;font-size:16px;letter-spacing:1px;cursor:pointer;box-shadow:3px 3px 0 var(--deep)}
.btnbig.alt{background:var(--panel);border-color:var(--line);color:var(--amber)}
.btnbig.bad{background:var(--red);border-color:var(--red);color:var(--deep)}
.tbl{display:flex;flex-direction:column;flex:none}
.th,.tr{display:grid;grid-template-columns:var(--cols);align-items:center;gap:2px;padding:0 6px;width:100%;text-align:left}
.th{height:28px;background:var(--deep);font-family:var(--px);font-size:12px;color:var(--muted)}
.tr{min-height:40px;background:var(--panel);border:0;border-bottom:1px solid var(--line);font-size:22px;color:var(--ink)}
button.tr{cursor:pointer}
.tr.xi{background:var(--panel2)}.tr.sel,.tr.me{background:var(--amber);color:var(--onamber)}
.tr span,.th span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .m{color:var(--muted)}.tr.sel .m,.tr.me .m,.tr.sel .amb,.tr.me .amb{color:var(--onamber)}
.n{text-align:right}
.pos{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.pos.up{background:var(--green);color:var(--deep)}.pos.dn{background:var(--red);color:var(--deep)}
.pitch{position:relative;height:320px;flex:none;border:2px solid var(--turf);overflow:hidden;background:repeating-linear-gradient(180deg,#0F3B22 0 40px,#124528 40px 80px)}
.pitch .c{position:absolute;left:50%;top:-46px;width:92px;height:92px;margin-left:-46px;border:2px solid var(--turf);border-radius:50%}
.pitch .pa{position:absolute;left:50%;bottom:0;width:180px;height:64px;margin-left:-90px;border:2px solid var(--turf);border-bottom:0}
.pitch .ga{position:absolute;left:50%;bottom:0;width:90px;height:26px;margin-left:-45px;border:2px solid var(--turf);border-bottom:0}
.pbtn{position:absolute;width:62px;height:56px;margin:-26px 0 0 -31px;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dot{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--onamber);border:2px solid var(--deep);display:flex;align-items:center;justify-content:center;font-size:20px}
.dot.gk{background:var(--blue)}.dot.off{background:var(--red)}
.pbtn.sel .dot{outline:3px solid #fff}
.nm{font-size:18px;line-height:1;text-shadow:1px 1px 0 var(--deep);white-space:nowrap;margin-top:1px}
.cyc{height:46px;flex:none;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 10px}
.cyc .v{display:flex;align-items:center}.cyc .v b{min-width:104px;text-align:center;font-weight:400;font-size:26px}
.cyc button{width:44px;height:42px;background:transparent;border:0;color:var(--amber);font-size:28px;cursor:pointer}
.bar{display:flex;height:10px;flex:1}.bar i{display:block;min-width:0}
.srow2{display:flex;align-items:center;gap:8px}.srow2 span{min-width:48px;font-size:22px;white-space:nowrap}.srow2 span:last-child{text-align:right}
.log{display:flex;flex-direction:column;font-size:21px;line-height:1.05}
.lg{display:grid;grid-template-columns:50px minmax(0,1fr);gap:4px;padding:5px 0;border-bottom:1px solid var(--line)}
.lg .m{color:var(--amber)}.lg.goal{color:var(--green)}.lg.ht{color:var(--blue)}.lg.red{color:var(--red)}
.sq{display:inline-block;width:10px;height:14px;margin-right:5px;vertical-align:-1px;background:var(--amber)}.sq.r{background:var(--red)}
.tabs{display:flex;gap:8px;flex:none}.tabs button{flex:1;height:40px;background:var(--panel);border:2px solid var(--line);color:var(--muted);font-family:var(--px);font-size:13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--amber);border-color:var(--amber);color:var(--onamber)}
.meter{height:12px;background:var(--deep);border:2px solid var(--line);flex:none}.meter i{display:block;height:100%;background:var(--green)}
.kv{display:flex;justify-content:space-between;gap:10px}.kv span:last-child{text-align:right}
textarea{width:100%;height:120px;background:var(--deep);color:var(--ink);border:2px solid var(--line);font-family:ui-monospace,monospace;font-size:13px;padding:8px;resize:vertical}
p{margin:0}
.para{display:flex;flex-direction:column;gap:8px;line-height:1.1}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}}

.pips{display:inline-flex;gap:3px;vertical-align:middle}.pips i{width:13px;height:13px;background:var(--deep);border:2px solid var(--line2);display:block}.pips i.on{background:var(--amber);border-color:var(--amber)}
.evt{background:var(--panel2);border:2px solid var(--amber);padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:none;box-shadow:3px 3px 0 var(--deep)}
.evt .t{font-family:var(--px);font-size:13px;color:var(--amber);letter-spacing:1px}
.btnrow{display:flex;gap:8px;flex:none}.btnrow .btnbig{height:46px;font-size:12px;padding:0 4px;flex:1;min-width:0}
.step{display:flex;align-items:center;gap:6px;flex:none}.step button{width:42px;height:44px;background:var(--panel);border:2px solid var(--line);color:var(--amber);font-family:var(--px);font-size:13px;cursor:pointer;flex:none;padding:0}
.ach{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:21px;line-height:1.05}
.ach.lock{color:var(--muted)}
.tag{display:inline-block;background:var(--amber);color:var(--onamber);font-family:var(--px);font-size:11px;padding:1px 5px;letter-spacing:1px;vertical-align:1px}
.news{font-size:21px;line-height:1.05;display:flex;flex-direction:column;gap:5px}
.lg.fill{color:var(--muted)}
.kv{font-size:22px}
.mk small{display:block;white-space:normal;font-size:19px;color:var(--muted);line-height:1}
.tr.sel small,.tr.me small{color:var(--onamber)}
.tr.res{font-size:20px;min-height:36px}
.tr.tb{font-size:19px;min-height:36px}
.kv2{display:flex;flex-direction:column;gap:0;padding:3px 0;border-bottom:1px solid var(--line)}.kv2 .k{font-size:18px;color:var(--muted)}
.scr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.scr .a{text-align:right}.scr>span{white-space:normal}
</style>

    else if(M.cup&&M.score[0]===M.score[1]){M.phase=4;addEv(M,evs,'ht',lab,'FULL TIME. '+H.abbr+' '+M.score[0]+'-'+M.score[1]+' '+A.abbr+'. It goes to penalties!',null);startShootout(M);}
    else{M.phase=3;addEv(M,evs,'ht',lab,'FULL TIME. '+H.abbr+' '+M.score[0]+'-'+M.score[1]+' '+A.abbr+'.',null);}
  }
  return evs;
}
function runAuto(M){var g=0;M.auto=true;while(M.phase!==3&&g++<700)advance(M);M.auto=false;M.forced=null;M.pen=null;}
function teamTalk(M,side,choice){
  var si=side===M.home?0:1,d=M.score[si]-M.score[1-si],good;
  if(choice==='PRAISE')good=d>0?0.75:d===0?0.55:0.35;
  else if(choice==='DEMAND')good=d<0?0.7:d===0?0.62:0.45;
  else if(choice==='CALM')good=Math.abs(d)<=1?0.65:0.5;
  else good=d<0?0.6:d===0?0.5:0.4;
  var ok=rnd()<good,big=choice==='FIRE UP';
  side.mor=ok?(big?1.05:1.035):(big?0.94:0.965);
  return ok?(big?'The players are fired up!':'The players respond well.'):(big?'It backfires. The players look rattled.':'The players look unconvinced.');
}

/* ---------- league ---------- */
function makeFixtures(ids){
  var n=ids.length,arr=shuffle(ids.slice()),rounds=[];
  for(var r=0;r<n-1;r++){var m=[];for(var i=0;i<n/2;i++){var a=arr[i],b=arr[n-1-i];if((r+i)%2===0)m.push({h:a,a:b});else m.push({h:b,a:a});}rounds.push(m);arr.splice(1,0,arr.pop());}
  var second=rounds.map(function(rd){return rd.map(function(f){return {h:f.a,a:f.h};});});
  return rounds.concat(second);
}
function sortedTable(G){
  return Object.keys(G.table).map(function(id){var t=G.table[id];return {id:id,p:t.p,w:t.w,d:t.d,l:t.l,gf:t.gf,ga:t.ga,gd:t.gf-t.ga,pts:t.pts};}).sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||(a.id<b.id?-1:1);});
}
function applyResult(G,rec){
  var h=G.table[rec.h],a=G.table[rec.a];h.p++;a.p++;h.gf+=rec.hg;h.ga+=rec.ag;a.gf+=rec.ag;a.ga+=rec.hg;
  if(rec.hg>rec.ag){h.w++;h.pts+=3;a.l++;}else if(rec.hg<rec.ag){a.w++;a.pts+=3;h.l++;}else{h.d++;a.d++;h.pts++;a.pts++;}
}
function userPos(G){return sortedTable(G).findIndex(function(x){return x.id===G.userId;})+1;}
function addMsg(G,title,body){G.inbox.unshift({id:G.nextMsg++,s:G.slot,title:title,body:body,read:false});if(G.inbox.length>50)G.inbox.length=50;}
function addNews(G,text){G.news.unshift({s:G.slot,text:text});if(G.news.length>12)G.news.length=12;}
function makeObjective(G){
  var ranked=Object.keys(G.clubs).map(function(id){return {id:id,r:teamRating(G,G.clubs[id])};}).sort(function(a,b){return b.r-a.r;});
  var idx=ranked.findIndex(function(x){return x.id===G.userId;}),pos=[2,3,4,5,6,7,8,9,9,9][idx],uc=G.clubs[G.userId];
  var cupT=uc.rep>=8?3:uc.rep<=3?1:2;
  return {pos:pos,text:'Finish in the top '+pos,cup:cupT,cupText:['','Reach the cup quarter-final','Reach the cup semi-final','Reach the cup final'][cupT]};
}

/* ---------- cup ---------- */
function pairUp(a){var t=[];for(var i=0;i+1<a.length;i+=2)t.push({h:a[i],a:a[i+1],hg:null,ag:null,pen:null,w:null});return t;}
function cupInit(G){
  var ids=CLUBS.map(function(c){return c.id;});
  var low=shuffle(ids.slice()).sort(function(a,b){return G.clubs[a].rep-G.clubs[b].rep;}).slice(0,4);
  G.cup={stage:0,bye:ids.filter(function(x){return low.indexOf(x)<0;}),ties:[pairUp(shuffle(low.slice()))],winner:null,userStage:-1,userOut:null};
}
function cupAdvance(G,stage){
  var ws=G.cup.ties[stage].map(function(t){return t.w;});
  if(stage===0){G.cup.ties[1]=pairUp(shuffle(G.cup.bye.concat(ws)));G.cup.stage=1;}
  else if(stage<3){G.cup.ties[stage+1]=pairUp(shuffle(ws));G.cup.stage=stage+1;}
  else{G.cup.winner=ws[0];G.cup.stage=4;}
}
function userInTie(G,st){return (G.cup.ties[st]||[]).some(function(t){return t.h===G.userId||t.a===G.userId;});}

/* ---------- economy ---------- */
function newLedger(){return {gate:0,tv:0,sponsor:0,prize:0,wages:0,xin:0,xout:0,fac:0,other:0};}
function pay(G,amt,cat,text){
  var uc=G.clubs[G.userId];uc.budget+=amt;var L=G.fin.season;L[cat]=(L[cat]||0)+amt;
  G.fin.log.unshift({s:G.slot,t:text,a:amt});if(G.fin.log.length>40)G.fin.log.length=40;
}
function capacity(c){return Math.round((4500+c.rep*1150)*(1+0.22*c.fac.stadium)/100)*100;}
function attendance(G,derby,pi){
  var c=G.clubs[G.userId],pos=userPos(G),fl=G.formLog[G.userId]||[],fs=0;
  fl.forEach(function(x){fs+=x==='W'?1:x==='L'?-1:0;});
  var a=0.52+(10-pos)*0.02+fs*0.012+c.rep*0.01+(derby?0.1:0);a=clamp(a,0.3,0.98);
  return Math.pow(a,PRICE[pi==null?G.price:pi].e);
}
function gateBase(G,derby,pi){var c=G.clubs[G.userId];return Math.round(capacity(c)*attendance(G,derby,pi)*PRICE[pi==null?G.price:pi].p/100)*100;}
function tvIncome(G){var c=G.clubs[G.userId];return Math.round((11000+(10-userPos(G))*1200+c.rep*600)/100)*100;}
function wageBill(G){var w=0;G.clubs[G.userId].squad.forEach(function(id){w+=G.players[id].wage;});return w;}
function makeSponsorOffers(G){
  var uc=G.clubs[G.userId],S=Math.round((300000+uc.rep*50000)*(0.95+rnd()*0.1)/10000)*10000,n=CAL.length,nm=shuffle(SPN.slice()).slice(0,3);
  G.sponsorOffers=[
   {type:'STEADY',name:nm[0],S:S,perSlot:Math.round(S/n/100)*100,perWin:0,lump:0},
   {type:'BONUS',name:nm[1],S:S,perSlot:Math.round(S*0.55/n/100)*100,perWin:Math.round(S*0.07/100)*100,lump:0},
   {type:'GAMBLE',name:nm[2],S:S,perSlot:Math.round(S*0.25/n/100)*100,perWin:0,lump:Math.round(S*1.5/10000)*10000}
  ];
}
function chooseSponsor(G,i){var o=G.sponsorOffers[i];if(!o)return;G.sponsor=JSON.parse(JSON.stringify(o));G.sponsorOffers=[];addMsg(G,'Sponsor: '+o.name,'You agreed a '+o.type+' deal with '+o.name+'.');}
function weekFinance(G,u){
  var out={gate:0,tv:0,sponsor:0,wages:0},wages=wageBill(G);
  pay(G,-wages,'wages','Wages');out.wages=wages;
  var tv=tvIncome(G);pay(G,tv,'tv','TV money');out.tv=tv;
  if(G.sponsor){var s=G.sponsor.perSlot+(u.win?G.sponsor.perWin:0);if(s>0){pay(G,s,'sponsor',G.sponsor.name);out.sponsor+=s;}}
  if(u.win&&G.kit>0){pay(G,G.kit,'sponsor','Kit win bonus');out.sponsor+=G.kit;}
  if(u.home){var g=Math.round(gateBase(G,u.derby)*(0.95+rnd()*0.1)/100)*100;pay(G,g,'gate','Gate receipts');out.gate=g;}
  return out;
}

/* ---------- transfers ---------- */
function makeMarketPlayer(G,kind){
  var uc=G.clubs[G.userId],lvl=uc.fac.scout,p,pos=wpick(['GK','DF','MF','FW'],function(x){return {GK:.6,DF:2,MF:2,FW:1.6}[x];});
  if(kind==='prospect'){p=makePlayer(G,pos,0,ri(17,20),clamp(uc.avg-14+ri(-5,5)+lvl,36,68));p.pot=clamp(p.ovr+ri(8,24),0,92);}
  else if(kind==='veteran'){p=makePlayer(G,pos,0,ri(31,35),clamp(uc.avg+ri(1,9),40,88));p.pot=p.ovr;}
  else if(kind==='star'){p=makePlayer(G,pos,0,ri(23,29),clamp(uc.avg+ri(8,15),50,90));p.pot=clamp(p.ovr+ri(0,3),0,92);}
  else{p=makePlayer(G,pos,0,ri(21,30),clamp(uc.avg+ri(-6,7)+lvl,40,88));}
  recalc(p);
  var w=[9,6,3,0][lvl],a=ri(0,w);p.potLo=Math.max(p.ovr,p.pot-a);p.potHi=Math.min(94,p.potLo+w);
  var seen=valueWith(p,Math.round((p.potLo+p.potHi)/2));
  p.ask=Math.max(5000,r5(seen*(0.92+rnd()*0.35)));p.floor=Math.max(5000,Math.min(p.ask,r5(p.ask*(0.82+rnd()*0.13))));
  p.mkt=true;p.bids=0;p.counter=0;p.kind=kind;
  return p;
}
function refreshMarket(G,full){
  var N=14+2*G.clubs[G.userId].fac.scout;
  if(full){G.market.forEach(function(id){delete G.players[id];});G.market=[];}
  else{shuffle(G.market.slice()).slice(0,5).forEach(function(id){delete G.players[id];G.market.splice(G.market.indexOf(id),1);});}
  G.market.forEach(function(id){var p=G.players[id];p.bids=0;p.counter=0;});
  if(full){['prospect','prospect','prospect','veteran','veteran','star'].forEach(function(k){G.market.push(makeMarketPlayer(G,k).id);});}
  while(G.market.length<N){var kind=wpick(['prospect','veteran','star','regular'],function(k){return {prospect:3,veteran:3,star:1.5,regular:6}[k];});G.market.push(makeMarketPlayer(G,kind).id);}
}
function bidPlayer(G,id,offer){
  var p=G.players[id];if(!p||!p.mkt)return {res:'gone'};
  if(offer>=p.floor)return {res:'accept',fee:offer};
  if(p.bids>=2)return {res:'walk'};
  p.bids++;
  if(offer>=p.floor*0.88){p.counter=Math.min(p.ask,Math.max(p.floor,r5(p.floor*(1+rnd()*0.05))));return {res:'counter',fee:p.counter};}
  return {res:'reject'};
}
function buyPlayer(G,id,fee){
  var uc=G.clubs[G.userId],p=G.players[id];
  if(!p||!p.mkt)return 'That player is no longer available.';
  if(uc.squad.length>=MAXSQ)return 'Squad is full ('+MAXSQ+').';
  if(uc.budget<fee)return 'Not enough money.';
  pay(G,-fee,'xin','Signed '+p.name);
  p.mkt=false;p.club=G.userId;p.paid=fee;p.listed=false;p.counter=0;
  uc.squad.push(p.id);G.market=G.market.filter(function(x){return x!==id;});
  validateLineup(G,uc);
  addMsg(G,'Signing: '+p.name,p.name+' ('+p.pos+', '+p.age+', RAT '+p.ovr+', POT '+p.pot+') joined for '+money(fee)+'.');
  var o=[];if(p.pot>=80)unlock(G,'gem',o);
  return null;
}
function moveToClub(G,p,clubId){
  var c=G.clubs[clubId];p.club=clubId;p.listed=false;c.squad.push(p.id);
  if(c.squad.length>24){var low=c.squad.map(function(x){return G.players[x];}).sort(function(a,b){return a.ovr-b.ovr;})[0];c.squad.splice(c.squad.indexOf(low.id),1);c.xi=c.xi.filter(function(x){return x!==low.id;});c.bench=c.bench.filter(function(x){return x!==low.id;});delete G.players[low.id];}
  validateLineup(G,c);
}
function sellPlayer(G,id,fee,clubId){
  var uc=G.clubs[G.userId],p=G.players[id];
  if(!p||uc.squad.indexOf(id)<0)return 'Not in your squad.';
  if(uc.squad.length<=MINSQ)return 'You need at least '+MINSQ+' players.';
  if(p.pos==='GK'&&uc.squad.filter(function(x){return G.players[x].pos==='GK';}).length<=2)return 'You need at least two goalkeepers.';
  var profit=fee-p.paid;
  uc.squad.splice(uc.squad.indexOf(id),1);uc.xi=uc.xi.filter(function(x){return x!==id;});uc.bench=uc.bench.filter(function(x){return x!==id;});
  pay(G,fee,'xout','Sold '+p.name);
  G.offers=G.offers.filter(function(o){return o.pid!==id;});
  moveToClub(G,p,clubId||pick(CLUBS.filter(function(c){return c.id!==G.userId;})).id);
  validateLineup(G,uc);
  addMsg(G,'Sale: '+p.name,p.name+' left for '+money(fee)+(p.paid?' (cost '+money(p.paid)+').':'.'));
  var o=[];if(profit>=300000)unlock(G,'profit',o);
  return null;
}
function quickSaleFee(p){return r5(p.value*0.75);}
function genOffers(G){
  var uc=G.clubs[G.userId];
  G.offers=G.offers.filter(function(o){return o.exp>=G.slot&&uc.squad.indexOf(o.pid)>=0;});
  uc.squad.forEach(function(id){
    var p=G.players[id];if(G.offers.some(function(o){return o.pid===id;}))return;
    var pr=p.listed?0.25:((p.ovr>=uc.avg+5||p.form>=2)?0.05:0);
    if(rnd()<pr){
      var buyer=pick(CLUBS.filter(function(c){return c.id!==G.userId;})).id,f=Math.max(5000,r5(p.value*(0.8+rnd()*0.4)*(1+0.02*p.form)));
      G.offers.push({id:G.nextMsg++,pid:id,club:buyer,fee:f,exp:G.slot+2,asked:false});
      addMsg(G,'Offer for '+p.name,G.clubs[buyer].name+' bid '+money(f)+' for '+p.name+'. See Transfers.');
    }
  });
}
function offerAccept(G,oid){var o=G.offers.filter(function(x){return x.id===oid;})[0];if(!o)return 'Offer expired.';return sellPlayer(G,o.pid,o.fee,o.club);}
function offerAsk(G,oid){
  var o=G.offers.filter(function(x){return x.id===oid;})[0];if(!o)return 'Offer expired.';
  if(o.asked)return 'You already asked for more.';

  G.offers=G.offers.filter(function(x){return x.id!==oid;});return 'walked';
}
function offerReject(G,oid){G.offers=G.offers.filter(function(x){return x.id!==oid;});}

/* ---------- facilities, training, youth ---------- */
function facCost(G,k){var uc=G.clubs[G.userId],l=uc.fac[k];return l>=3?null:FAC[k].c[l];}
function upgradeFac(G,k){
  var uc=G.clubs[G.userId],c=facCost(G,k);
  if(c==null)return 'Already at the top level.';

}
function trainWeek(G){
  var uc=G.clubs[G.userId],f=G.train,lvl=uc.fac.train,log=[];
  uc.squad.forEach(function(id){
    var p=G.players[id];if(p.ovr>=p.pot||p.age>30)return;
    var inF=(f==='ATTACK'&&(p.pos==='FW'||p.pos==='MF'))||(f==='DEFENCE'&&(p.pos==='DF'||p.pos==='GK'))||(f==='YOUTH'&&p.age<=21);
    var ch=0.012*(1+0.3*lvl)*(f==='BALANCED'?1:f==='FITNESS'?0.5:inF?1.8:0.5);

  });

}
function youthIntake(G,club){

  for(var i=0;i<n;i++){

    var p=makePlayer(G,pos,0,age,ovr);p.pot=clamp(ovr+ri(12,24)+lvl*2,ovr,92);recalc(p);p.club=club.id;club.squad.push(p.id);made.push(p);
  }
  return made;
}

/* ---------- events ---------- */
function rollEvent(G){
  var uc=G.clubs[G.userId],ids=['friendly','donation','payrise','kit','agent','repair'],last=G.lastEvent;
  var id=pick(ids.filter(function(x){return x!==last;}));
  var e={id:id,s:G.slot};
  if(id==='friendly'){e.fee=r5(60000+uc.rep*8000);}
  else if(id==='donation'){e.fee=r5(40000+rnd()*110000);}
  else if(id==='payrise'){var best=uc.squad.map(function(x){return G.players[x];}).sort(function(a,b){return b.ovr-a.ovr;})[0];e.pid=best.id;e.fee=Math.max(10000,r5(best.wage*20));}
  else if(id==='kit'){e.cash=r5(50000+uc.rep*6000);e.perWin=r5(12000+uc.rep*1500);}
  else if(id==='agent'){var p=makePlayer(G,pick(['MF','FW','DF']),0,ri(18,21),clamp(uc.avg-8+ri(-4,4),40,72));p.pot=clamp(p.ovr+ri(8,22),0,90);recalc(p);p.club=null;p.agent=true;e.pid=p.id;e.fee=r5(p.value*0.6);e.lo=Math.max(p.ovr,p.pot-ri(0,6));e.hi=Math.min(94,e.lo+6);}
  else if(id==='repair'){e.full=r5(50000+uc.rep*5000);e.cheap=Math.round(e.full*0.4/5000)*5000;}
  G.lastEvent=id;return e;
}
function eventInfo(G){
  var e=G.event;if(!e)return null;
  switch(e.id){
   case 'friendly':return {title:'FRIENDLY TOURNAMENT',body:'Organisers offer '+money(e.fee)+' for a short tour. Your players would come back tired (-12 fitness).',ch:['ACCEPT','DECLINE']};
   case 'donation':return {title:'FAN DONATION',body:'A local businessman donates '+money(e.fee)+' to the club.',ch:['THANK HIM']};
   case 'payrise':{var p=G.players[e.pid];return {title:'PAY DEMAND',body:(p?p.name:'Your star')+' wants a '+money(e.fee)+' bonus. Refuse and his form will suffer.',ch:['PAY BONUS','REFUSE']};}
   case 'kit':return {title:'KIT DEAL',body:'Your kit supplier offers '+money(e.cash)+' now, or '+money(e.perWin)+' for every win this season.',ch:['TAKE CASH','PER-WIN BONUS']};
   case 'agent':{var q=G.players[e.pid];return {title:'AGENT CALL',body:'Free agent '+(q?q.name:'')+' ('+(q?q.pos+', age '+q.age+', RAT '+q.ovr:'')+'). Signing fee '+money(e.fee)+'. The agent claims potential '+e.lo+'-'+e.hi+'.',ch:['SIGN HIM','PASS']};}
   case 'repair':return {title:'STADIUM REPAIR',body:'The roof needs work. A full repair costs '+money(e.full)+'. A patch-up costs '+money(e.cheap)+' but may fail.',ch:['FULL REPAIR','PATCH IT']};
  }

}
function dropAgent(G,e){if(e&&e.id==='agent'&&G.players[e.pid]&&!G.players[e.pid].club)delete G.players[e.pid];}
function resolveEvent(G,i){
  var e=G.event,uc=G.clubs[G.userId];if(!e)return '';
  var msg='';
  if(e.id==='friendly'){if(i===0){pay(G,e.fee,'other','Friendly tournament');uc.squad.forEach(function(id){var p=G.players[id];p.fit=Math.max(30,p.fit-12);});msg='Tour agreed: '+money(e.fee)+' banked, players tired.';}else msg='You declined.';}
  else if(e.id==='donation'){pay(G,e.fee,'other','Fan donation');msg='Donation received: '+money(e.fee)+'.';}
  else if(e.id==='payrise'){var p=G.players[e.pid];if(p){if(i===0){if(uc.budget>=e.fee){pay(G,-e.fee,'other','Bonus for '+p.name);p.form=Math.min(3,p.form+1);msg=p.name+' is delighted.';}else msg='You cannot afford it.';}else{p.form=Math.max(-3,p.form-1);msg=p.name+' is unhappy.';}}}
  else if(e.id==='kit'){if(i===0){pay(G,e.cash,'sponsor','Kit deal');msg='Kit deal: '+money(e.cash)+' banked.';}else{G.kit=e.perWin;msg='Win bonus of '+money(e.perWin)+' agreed.';}}
  else if(e.id==='agent'){if(i===0){var q=G.players[e.pid];if(uc.budget<e.fee)return 'You cannot afford it.';if(uc.squad.length>=MAXSQ)return 'Squad is full.';pay(G,-e.fee,'xin','Signed '+q.name);q.club=G.userId;q.agent=false;q.paid=e.fee;uc.squad.push(q.id);validateLineup(G,uc);msg=q.name+' signed.';}else{dropAgent(G,e);msg='You passed.';}}
  else if(e.id==='repair'){if(i===0){pay(G,-e.full,'other','Stadium repair');msg='Repair done.';}else{pay(G,-e.cheap,'other','Stadium patch-up');if(rnd()<0.35){pay(G,-e.full*2,'other','Repair failed');G.board.conf=Math.max(0,G.board.conf-3);msg='The patch failed. A bigger bill follows.';}else msg='The patch holds.';}}
  G.event=null;return msg;
}

/* ---------- achievements ---------- */

/* ---------- game setup ---------- */

/* ---------- match processing ---------- */
function simAI(G,hId,aId,cup){
  var hc=G.clubs[hId],ac=G.clubs[aId];autoPick(G,hc);autoPick(G,ac);
  var M=createMatch(G,hc,ac,G.userId,aiTactics(G,hc,ac,true),aiTactics(G,ac,hc,false),cup);runAuto(M);return M;
}
function finalize(G,M){
  var hs=M.score[0],as=M.score[1],w=M.winner!=null?M.winner:(hs>as?0:hs<as?1:null);
  var rec={h:M.home.id,a:M.away.id,hg:hs,ag:as,pen:M.pk?[M.pk.hs,M.pk.as]:null,w:w===null?null:(w===0?M.home.id:M.away.id),goals:M.goals.slice(),cards:[],injs:[],mom:null,derby:M.derby,rt:M.rt,htd:M.ht,hat:null};
  var ratings=[],best=null;
  [M.home,M.away].forEach(function(side,si){
    var gf=M.score[si],ga=M.score[1-si],res=w===null?(gf>ga?0.4:gf<ga?-0.3:0.1):(w===si?0.35:-0.25);
    side.all.forEach(function(pm){
      var p=pm.p;
      if(pm.min>0||pm.came){
        p.apps++;p.fit=Math.round(pm.fit);p.goals+=pm.goals;p.assists+=pm.assists;
        if(pm.yc>0)p.yc+=1;
        if(pm.red){p.rc++;p.susp=1;rec.cards.push({name:p.name,side:si,red:true});}
        else if(pm.yc>0)rec.cards.push({name:p.name,side:si,red:false});
      }
      if(pm.goals>=3)rec.hat={name:sn(p.name),side:si};
      if(pm.min>=15||pm.red){
        var r=6+pm.goals*1.1+pm.assists*0.7+res+(ga===0?(pm.slot==='GK'||pm.slot==='DF'?0.6:pm.slot==='MF'?0.2:0):0)+(pm.slot==='GK'?pm.saves*0.18-Math.max(0,ga-1)*0.25:0)-pm.yc*0.3-(pm.red?2:0)+gauss()*0.45+(p.ovr-70)*0.012;
        r=r1(clamp(r,3.5,10));pm.r=r;p.rsum+=r;p.rn++;p.form=clamp(r1(p.form+(r-6.5)*0.5),-3,3);
        ratings.push({id:p.id,name:p.name,pos:pm.slot||p.pos,side:si,r:r,g:pm.goals,a:pm.assists});
        if(!best||r>best.r||(r===best.r&&pm.goals>best.g))best={id:p.id,name:p.name,r:r,side:si,g:pm.goals};
      }
      if(pm.inj){var wk=rnd()<0.1?ri(7,14):ri(1,6);p.injW=wk;rec.injs.push({id:p.id,name:p.name,weeks:wk,side:si});}
    });
  });
  if(best){rec.mom={id:best.id,name:best.name,r:best.r,side:best.side};var bp=G.players[best.id];if(bp)bp.mom++;}
  return {rec:rec,ratings:ratings};
}

function commitSlot(G,userM){

    var oppId=home?ur.a:ur.h,myRt=home?ur.rt[0]:ur.rt[1],opRt=home?ur.rt[1]:ur.rt[0],gap=opRt-myRt;
    u.played=true;u.home=home;u.win=won;u.derby=ur.derby;

    if(slot.t==='C')d=won?1:lost?-1:0;
    if(ur.derby)d+=won?2:lost?-2:0;

    G.unb=lost?0:G.unb+1;
    if(won)unlock(G,'first_win',out.newAch);

    if(won&&gap>=4)unlock(G,'giant',out.newAch);
    if(won&&gf-ga>=4)unlock(G,'goal_fest',out.newAch);
    if(won&&ur.htd&&(home?ur.htd[0]<ur.htd[1]:ur.htd[1]<ur.htd[0]))unlock(G,'comeback',out.newAch);
    if(won&&ur.derby)unlock(G,'derby',out.newAch);
    if(G.unb>=8)unlock(G,'unbeaten',out.newAch);
    if(won&&ur.pen)unlock(G,'shootout',out.newAch);
    if(slot.t==='C'){
      var st=slot.i;G.cup.userStage=Math.max(G.cup.userStage,st);
      if(won){
        var prize=CUPPRIZE[st];pay(G,prize,'prize','Cup: won '+CUPN[st].toLowerCase());out.note='Cup prize '+money(prize)+'.';
        if(st>=1)unlock(G,'cup_semi',out.newAch);

      }else{G.cup.userOut=st;if(st===3){pay(G,100000,'prize','Cup: runners-up');out.note='Runners-up prize '+money(100000)+'.';}}
    }
  }
  if(slot.t==='L'){
    recs.forEach(function(r){
      [[r.h,r.hg,r.ag],[r.a,r.ag,r.hg]].forEach(function(x){
        var res=x[1]>x[2]?'W':x[1]<x[2]?'L':'D',fl=G.formLog[x[0]];fl.push(res);if(fl.length>5)fl.shift();
        G.run[x[0]]=res==='W'?G.run[x[0]]+1:0;

      });
    });
    var T=sortedTable(G);
    if(G.slot>=3&&G.leader&&T[0].id!==G.leader)addNews(G,(T[0].id===G.userId?'You':G.clubs[T[0].id].short)+' go top of the table.');
    G.leader=T[0].id;
  }
  recs.forEach(function(r){

    var up=r.hg>r.ag?(r.rt[1]-r.rt[0]>=6):r.hg<r.ag?(r.rt[0]-r.rt[1]>=6):false;

  if(ur){
    var home2=ur.h===G.userId,gf2=home2?ur.hg:ur.ag,ga2=home2?ur.ag:ur.hg,won2=ur.w!==null?ur.w===G.userId:gf2>ga2,lost2=ur.w!==null?ur.w!==G.userId:gf2<ga2;
    var lines=[G.clubs[ur.h].name+' '+ur.hg+'-'+ur.ag+' '+G.clubs[ur.a].name+(ur.pen?' ('+ur.pen[0]+'-'+ur.pen[1]+' pens)':''),''];
    if(ur.goals.length)lines.push('Goals: '+ur.goals.map(function(g){return g.name+' '+g.label;}).join(', '));
    if(ur.mom)lines.push('Man of the match: '+ur.mom.name+' ('+ur.mom.r+').');
    ur.cards.forEach(function(c){if(c.red)lines.push('Red card: '+c.name+' (one-match ban).');});
    ur.injs.forEach(function(x){if((x.side===0)===home2)lines.push('Injury: '+x.name+' is out for '+x.weeks+' week'+(x.weeks>1?'s':'')+'.');});

  }

  return out;
}
function skipIdle(G){
  while(G.slot<CAL.length&&CAL[G.slot].t==='C'&&!userInTie(G,CAL[G.slot].i))commitSlot(G,null);
}

/* ---------- season end ---------- */
function awardsOf(G){
  var ps=Object.keys(G.players).map(function(id){return G.players[id];}).filter(function(p){return p.club;});
  var boot=ps.slice().sort(function(a,b){return b.goals-a.goals||a.apps-b.apps;})[0];
  var best=ps.filter(function(p){return p.rn>=8;}).sort(function(a,b){return b.rsum/b.rn-a.rsum/a.rn;})[0];
  var young=ps.filter(function(p){return p.age<=21&&p.rn>=6;}).sort(function(a,b){return b.rsum/b.rn-a.rsum/a.rn;})[0];
  function f(p,extra){return p?{name:p.name,club:G.clubs[p.club].short,v:extra}:null;}
  return {boot:boot&&boot.goals>0?f(boot,boot.goals+' goals'):null,best:best?f(best,r1(best.rsum/best.rn)+' avg'):null,young:young?f(young,r1(young.rsum/young.rn)+' avg'):null};
}
function endSeason(G){
  var T=sortedTable(G),pos=T.findIndex(function(x){return x.id===G.userId;})+1,champ=G.clubs[T[0].id],uc=G.clubs[G.userId],o=[];
  var prize=LGPRIZE[pos-1];if(prize>0)pay(G,prize,'prize','League prize ('+ord(pos)+')');
  var okL=pos<=G.board.obj.pos,okC=G.cup.userStage>=G.board.obj.cup,bonus=0;
  if(okL){bonus+=100000+30000*(G.board.obj.pos-pos);unlock(G,'objective',o);}
  if(okC)bonus+=60000;
  if(bonus>0)pay(G,bonus,'prize','Board bonus');
  var sp='';
  if(G.sponsor&&G.sponsor.lump>0){if(okL){pay(G,G.sponsor.lump,'sponsor',G.sponsor.name+' bonus');sp='Sponsor bonus paid: '+money(G.sponsor.lump)+'.';}else sp='Sponsor bonus missed.';}
  G.board.conf=clamp(G.board.conf+(okL?12:-12)+(okC?5:-3),0,100);
  if(pos===1){G.trophies.push({season:G.season,t:'LEAGUE'});unlock(G,'champion',o);}

  G.end={pos:pos,champ:champ.name,prize:prize,bonus:bonus,okL:okL,okC:okC,sacked:sacked,obj:G.board.obj.text,cupObj:G.board.obj.cupText,season:G.season,awards:awardsOf(G),net:net,cupRes:cupRes,sp:sp,ledger:JSON.parse(JSON.stringify(L))};
  G.history.push({season:G.season,pos:pos,champ:champ.name,cup:cupRes,net:net});

  addMsg(G,'Season '+G.season+'/'+String(G.season+1).slice(2)+' review','You finished '+ord(pos)+'. '+champ.name+' won the league.\nCup: '+cupRes+'.\nPrize money '+money(prize)+', board bonus '+money(bonus)+'.\n'+(okL?'League objective met.':'League objective missed.')+(sacked?'\n\nThe board has dismissed you.':''));
}
function progress(p){
  var d;
  if(p.age<=23)d=Math.round((p.pot-p.ovr)*(0.25+rnd()*0.4)+gauss()*1);
  else if(p.age<=27)d=Math.round((p.pot-p.ovr)*(0.2+rnd()*0.3)+gauss()*0.8);
  else if(p.age<=30)d=Math.round(gauss()*1.1-0.4);
  else if(p.age<=33)d=-ri(0,3);
  else d=-ri(1,4);
  p.ovr=clamp(p.ovr+d,35,92);
  if(p.age>=24)p.pot=p.ovr+Math.round(Math.max(0,p.pot-p.ovr)*0.6);
  if(p.age>=29)p.pot=p.ovr;
  if(p.ovr>p.pot)p.pot=p.ovr;
  recalc(p);
}
function nextSeason(G){

    var p=G.players[id];if(p.mkt||p.agent)return;

  });

    var c=G.clubs[cid],isU=cid===G.userId;
    c.squad=c.squad.filter(function(id){var p=G.players[id];var ret=p.age>=36||(p.age>=34&&p.ovr<55&&rnd()<0.6);if(ret){if(isU)retired.push(p.name);delete G.players[id];return false;}return true;});
    if(!isU){
      c.avg=clamp(c.avg+(c.rep>=6?ri(0,1):ri(-1,1)),55,82);
      for(var k=0;k<2;k++){
        var low=c.squad.map(function(x){return G.players[x];}).sort(function(a,b){return a.ovr-b.ovr;})[0];
        if(low){c.squad.splice(c.squad.indexOf(low.id),1);var np=makePlayer(G,low.pos,0,ri(20,27),clamp(c.avg+ri(-2,4),40,88));np.club=cid;c.squad.push(np.id);delete G.players[low.id];}
      }
    }
    var need={GK:2,DF:6,MF:6,FW:4};
    Object.keys(need).forEach(function(pos){var n=c.squad.filter(function(id){return G.players[id].pos===pos;}).length;while(n<need[pos]){var p=makePlayer(G,pos,c.avg-6,ri(17,20));p.club=cid;c.squad.push(p.id);n++;}});
    if(!isU){while(c.squad.length>24){var l2=c.squad.map(function(id){return G.players[id];}).sort(function(a,b){return a.ovr-b.ovr;})[0];c.squad.splice(c.squad.indexOf(l2.id),1);delete G.players[l2.id];}}
    c.xi=c.xi.filter(function(id){return !!G.players[id];});c.bench=c.bench.filter(function(id){return !!G.players[id];});
  });
  kids=youthIntake(G,G.clubs[G.userId]);
  G.season++;G.slot=0;G.results=[];G.unb=0;G.kit=0;G.event=null;G.offers=[];G.news=[];G.leader=null;
  Object.keys(G.table).forEach(function(id){G.table[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};G.formLog[id]=[];G.run[id]=0;});
  G.fixtures=makeFixtures(CLUBS.map(function(c){return c.id;}));
  cupInit(G);
  Object.keys(G.clubs).forEach(function(id){autoPick(G,G.clubs[id]);});
  G.board.obj=makeObjective(G);G.phase='play';G.end=null;G.sponsor=null;G.fin.season=newLedger();
  refreshMarket(G,true);makeSponsorOffers(G);
  addMsg(G,'New season '+G.season+'/'+String(G.season+1).slice(2),'Players have aged and developed.'+(retired.length?'\nRetired: '+retired.join(', ')+'.':'')+(kids.length?'\nYouth academy intake: '+kids.map(function(k){return k.name+' ('+k.pos+', RAT '+k.ovr+', POT '+k.pot+')';}).join(', ')+'.':'')+'\n\nLeague objective: '+G.board.obj.text+'.\nCup objective: '+G.board.obj.cupText+'.\nChoose a sponsor to begin.');
}

function readSave(){var s=null;try{s=localStorage.getItem(KEY);}catch(e){}if(!s)s=memSave;if(!s)return null;try{var g=JSON.parse(s);if(g&&g.v===2&&g.clubs&&g.players&&g.fixtures&&g.cup)return g;}catch(e){}return null;}
function hasSave(){return !!readSave();}
function UC(){return G.clubs[G.userId];}
function achCount(){return Object.keys(G.ach).length;}
function achToast(before,msg){var n=achCount()-before;toast((msg?msg+' ':'')+(n>0?'Achievement unlocked! +£25K':''));}

/* ---------- ui helpers ---------- */
function menuBtn(label,act,extra,sel,right){return '<button type="button" class="mbtn'+(sel?' sel':'')+'" data-act="'+act+'"'+(extra||'')+'><span>'+label+'</span><span class="r">'+(right==null?'&gt;':right)+'</span></button>';}
function softHtml(items){return items.map(function(it,i){var al=items.length===1?'r':i===0?'l':i===items.length-1?'r':'c';return '<button type="button" class="'+al+'" data-act="'+it.a+'"'+(it.d||'')+'>'+it.l+'</button>';}).join('');}
function toast(msg){if(!msg)return;var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function fitCell(p){if(p.injW>0)return '<span class="red n">INJ</span>';if(p.susp>0)return '<span class="red n">BAN</span>';var c=p.fit>=90?'grn':p.fit>=75?'amb':'red';return '<span class="'+c+' n">'+Math.round(p.fit)+'</span>';}
function formTxt(p){var f=p.form;return f>=1.5?'<span class="grn">HOT</span>':f>=0.5?'<span class="grn">GOOD</span>':f<=-1.5?'<span class="red">POOR</span>':f<=-0.5?'<span class="amb">LOW</span>':'<span class="mut">OK</span>';}
function formHtml(){var r=userResults(G).slice(-5);if(!r.length)return '<span class="mut">No matches played yet</span>';return '<span class="lbl" style="margin-right:4px">FORM</span>'+r.map(function(x){return '<i class="'+x.res+'">'+x.res+'</i>';}).join('');}
function pips(n){var s='<span class="pips" role="img" aria-label="level '+n+' of 3">';for(var i=0;i<3;i++)s+='<i class="'+(i<n?'on':'')+'"></i>';return s+'</span>';}
function kv(a,b,cls){return '<div class="kv"><span class="mut">'+a+'</span><span'+(cls?' class="'+cls+'"':'')+'>'+b+'</span></div>';}
function kv2(a,b,cls){return '<div class="kv2"><span class="k">'+a+'</span><span'+(cls?' class="'+cls+'"':'')+'>'+b+'</span></div>';}
function signed(n){return n===0?money(0):(n>0?'+':'')+money(n);}
function cycRow(label,key,val,act){var a=act||'cyc';return '<div class="cyc"><span class="lbl">'+label+'</span><span class="v"><button type="button" aria-label="Previous '+label.toLowerCase()+'" data-act="'+a+'" data-k="'+key+'" data-dir="-1">&lt;</button><b>'+val+'</b><button type="button" aria-label="Next '+label.toLowerCase()+'" data-act="'+a+'" data-k="'+key+'" data-dir="1">&gt;</button></span></div>';}
function tabsHtml(list,cur){return '<div class="tabs">'+list.map(function(t){return '<button type="button" class="'+(t[0]===cur?'on':'')+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';}
function tableRowsHtml(T,limit){
  var cols='24px minmax(0,1fr) 26px 26px 26px 26px 36px 34px';
  var h='<div class="tbl"><div class="th" style="--cols:'+cols+'"><span>#</span><span>CLUB</span><span class="n">P</span><span class="n">W</span><span class="n">D</span><span class="n">L</span><span class="n">GD</span><span class="n">PTS</span></div>';
  T.slice(0,limit||T.length).forEach(function(t,i){
    var c=G.clubs[t.id],me=t.id===G.userId,z=i===0?' up':i>=T.length-2?' dn':'';
    h+='<div class="tr tb'+(me?' me':'')+'" style="--cols:'+cols+'"><span class="pos'+(me?'':z)+'">'+(i+1)+'</span><span>'+esc(c.short)+'</span><span class="n">'+t.p+'</span><span class="n">'+t.w+'</span><span class="n">'+t.d+'</span><span class="n">'+t.l+'</span><span class="n">'+(t.gd>0?'+':'')+t.gd+'</span><span class="n amb">'+t.pts+'</span></div>';
  });
  return h+'</div>';
}
function allPlayers(){return Object.keys(G.players).map(function(id){return G.players[id];}).filter(function(p){return p.club;});}

   menuBtn('CLUB','go',' data-to="club"',false,'')+menuBtn('CALENDAR','go',' data-to="calendar"',false,'')+
   menuBtn('TABLE','go',' data-to="table"',false,'')+menuBtn('CAREER','go',' data-to="career"',false,'')+'</div>';
  return {title:esc(uc.name.toUpperCase()),right:G.phase==='play'?'MD '+(G.slot+1)+'/'+CAL.length:'END',body:h,soft:[{l:'SAVE',a:'save'},{l:'HELP',a:'help'},{l:'MENU',a:'toMenu'}]};

SCREENS.inbox=function(){
  var h='';
  if(!G.inbox.length)h='<div class="mut">No messages.</div>';
  G.inbox.forEach(function(m){h+=menuBtn((m.read?'':'<span class="amb">* </span>')+esc(m.title),'openMsg',' data-id="'+m.id+'"',false,'MD'+(m.s+1));});

SCREENS.msg=function(p){
  var m=G.inbox.filter(function(x){return x.id===p.id;})[0];
  if(!m)return {title:'INBOX',body:'<div class="mut">Message not found.</div>'};
  return {title:'MESSAGE',right:'MD'+(m.s+1),body:'<div class="card"><div class="big">'+esc(m.title)+'</div><div class="para" style="margin-top:6px">'+m.body.split('\n').map(function(l){return l?'<p>'+esc(l)+'</p>':'<p>&nbsp;</p>';}).join('')+'</div></div>'};

SCREENS.squad=function(p){
  var uc=UC(),sort=p.sort||'pos',order={GK:0,DF:1,MF:2,FW:3};
  var list=uc.squad.map(function(id){return G.players[id];});
  list.sort(function(a,b){
    if(sort==='rat')return b.ovr-a.ovr;if(sort==='fit')return b.fit-a.fit;if(sort==='pot')return b.pot-a.pot||b.ovr-a.ovr;if(sort==='gls')return b.goals-a.goals||b.ovr-a.ovr;if(sort==='val')return b.value-a.value;
    return order[a.pos]-order[b.pos]||b.ovr-a.ovr;
  });
  var xi={};uc.xi.forEach(function(id){xi[id]=1;});
  var wages=0,sum=0;list.forEach(function(q){wages+=q.wage;sum+=q.ovr;});
  var cols='34px minmax(0,1fr) 30px 42px 36px 36px';
  var h='<div class="mut" style="font-size:20px">'+list.length+'/'+MAXSQ+' players - avg RAT '+Math.round(sum/list.length)+' - wages '+money(wages)+'/wk</div><div class="tbl"><div class="th" style="--cols:'+cols+'"><span>POS</span><span>NAME</span><span class="n">AGE</span><span class="n">FIT</span><span class="n">RAT</span><span class="n">POT</span></div>';
  list.forEach(function(q){
    h+='<button type="button" class="tr'+(xi[q.id]?' xi':'')+'" style="--cols:'+cols+'" data-act="openPlayer" data-id="'+q.id+'"><span class="m">'+q.pos+'</span><span>'+(q.listed?'<span class="amb">$ </span>':'')+esc(q.name)+'</span><span class="n">'+q.age+'</span>'+fitCell(q)+'<span class="n">'+q.ovr+'</span><span class="n '+(q.pot-q.ovr>=8?'grn':'m')+'">'+q.pot+'</span></button>';
  });
  h+='</div><div class="mut" style="font-size:20px">Shaded rows start. $ = listed for sale. Green POT = room to grow.</div>';
  var lab={pos:'POS',rat:'RAT',fit:'FIT',pot:'POT',gls:'GOALS',val:'VALUE'}[sort];
  return {title:'SQUAD',right:uc.formation,body:h,soft:[{l:'SORT: '+lab,a:'sortSquad'},{l:'BACK',a:'back'}]};
};
SCREENS.player=function(p){
  var q=G.players[p.id];if(!q)return {title:'PLAYER',body:'<div class="mut">Player not found.</div>'};
  var uc=UC(),own=uc.squad.indexOf(q.id)>=0,mk=!!q.mkt;
  var where=uc.xi.indexOf(q.id)>=0?'Starting XI':uc.bench.indexOf(q.id)>=0?'Bench':own?'Reserve':'Transfer list';
  var status=q.injW>0?'<span class="red">Injured ('+q.injW+' wk)</span>':q.susp>0?'<span class="red">Suspended</span>':'<span class="grn">Available</span>';
  var potS=mk?(q.potLo===q.potHi?String(q.potLo):q.potLo+'-'+q.potHi):String(q.pot);
  var h='<div class="card"><div class="big">'+esc(q.name)+'</div><div class="mut">'+({GK:'Goalkeeper',DF:'Defender',MF:'Midfielder',FW:'Forward'})[q.pos]+' - age '+q.age+'</div></div>';
  h+='<div class="grid3"><div class="stat"><span class="lbl">RATING</span><b>'+q.ovr+'</b></div><div class="stat"><span class="lbl">POTENTIAL</span><b>'+potS+'</b></div><div class="stat"><span class="lbl">FITNESS</span><b>'+Math.round(q.fit)+'</b></div></div>';
  h+='<div class="card">'+kv('Status',status)+kv('Form',formTxt(q));
  if(!mk)h+=kv('Role',where)+kv('Appearances',q.apps)+kv('Goals / assists',q.goals+' / '+q.assists)+kv('Average rating',q.rn?r1(q.rsum/q.rn):'-')+kv('Man of the match',q.mom)+kv('Cards (Y/R)',q.yc+' / '+q.rc)+kv('Market value',money(q.value),'amb');
  h+=kv('Wage',money(q.wage)+'/wk');
  if(own&&q.paid)h+=kv('You paid',money(q.paid));
  h+='</div>';
  if(own){
    var fee=quickSaleFee(q);
    h+='<button type="button" class="btnbig alt" data-act="listToggle" data-id="'+q.id+'">'+(q.listed?'REMOVE FROM TRANSFER LIST':'LIST FOR SALE (GET OFFERS)')+'</button>';
    if(p.confirm)h+='<div class="card"><div>Sell '+esc(q.name)+' now for '+money(fee)+'? Listed players usually fetch more.</div></div><button type="button" class="btnbig bad" data-act="sellYes" data-id="'+q.id+'">CONFIRM QUICK SALE</button><button type="button" class="btnbig alt" data-act="back">KEEP PLAYER</button>';
    else h+='<button type="button" class="btnbig alt" data-act="sell" data-id="'+q.id+'">QUICK SALE '+money(fee)+'</button>';
  }else if(mk){
    h+=kv('Asking price',money(q.ask),'amb')+kv('Your bank',money(uc.budget))+'<div class="mut" style="font-size:20px">Potential is a scout estimate. A better scout network narrows it.</div><button type="button" class="btnbig" data-act="go" data-to="bid" data-id="'+q.id+'">NEGOTIATE</button>';
  }
  return {title:'PLAYER',right:q.pos,body:h};
};
SCREENS.bid=function(p){
  var q=G.players[p.id];
  if(!q||!q.mkt)return {title:'TRANSFER',body:'<div class="mut">This player is no longer available.</div>'};
  var uc=G.clubs[G.userId],offer=p.offer!=null?p.offer:Math.round(q.ask*0.92/5000)*5000;
  var h='<div class="card"><div class="big">'+esc(q.name)+'</div><div class="mut">'+q.pos+' - age '+q.age+' - RAT '+q.ovr+' - POT '+(q.potLo===q.potHi?q.potLo:q.potLo+'-'+q.potHi)+'</div></div>';
  h+='<div class="card">'+kv('Asking price',money(q.ask),'amb')+kv('Your bank',money(uc.budget))+kv('Attempts left',Math.max(0,2-q.bids))+'</div>';
  var u=Math.max(5000,Math.round(q.ask*0.01/5000)*5000);
  h+='<div class="lbl">YOUR OFFER</div><div class="step"><button type="button" aria-label="Lower by '+money(5*u)+'" data-act="bidAdj" data-d="'+(-5*u)+'">-5%</button><button type="button" aria-label="Lower by '+money(u)+'" data-act="bidAdj" data-d="'+(-u)+'">-1%</button><div style="flex:1;min-width:0;text-align:center;font-size:26px" class="amb">'+money(offer)+'</div><button type="button" aria-label="Raise by '+money(u)+'" data-act="bidAdj" data-d="'+u+'">+1%</button><button type="button" aria-label="Raise by '+money(5*u)+'" data-act="bidAdj" data-d="'+(5*u)+'">+5%</button></div>';
  if(p.msg)h+='<div class="card"><div>'+esc(p.msg)+'</div></div>';
  h+='<button type="button" class="btnbig" data-act="bid" data-id="'+q.id+'">MAKE OFFER</button>';

    var la=loc(selId),lb=loc(id);
    if(la.l==='r'&&lb.l==='r'){selId=null;render(false);return;}
    if((lb.l!=='r'&&!avail(A))||(la.l!=='r'&&!avail(B))){toast((!avail(A)&&lb.l!=='r'?A.name:B.name)+' is not available.');selId=null;render(false);return;}
    function set(l,i,v){if(l==='xi')c.xi[i]=v;else if(l==='b')c.bench[i]=v;}
    set(la.l,la.i,id);set(lb.l,lb.i,selId);
    selId=null;saveGame();render(false);
  },
  exportBk:function(){var g=G||readSave();if(!g){toast('Nothing to export yet.');return;}var c=stack[stack.length-1];c.p.out=JSON.stringify(g);render(false);},
  copyBk:function(){var t=$('bkOut');if(!t)return;var done=function(){toast('Copied.');};try{navigator.clipboard.writeText(t.value).then(done,function(){t.select();toast('Press copy on your keyboard.');});}catch(e){t.select();toast('Select and copy the code.');}},
  loadBk:function(){var t=$('bkIn');if(!t||!t.value.trim()){toast('Paste a save code first.');return;}try{var g=JSON.parse(t.value.trim());if(!(g&&g.v===2&&g.clubs&&g.players&&g.fixtures&&g.cup))throw new Error('bad');G=g;saveGame();toast('Save restored.');resetTo([{n:'hub',p:{}}]);}catch(e){toast('That code is not a valid save.');}}
};
function onClick(e){var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t||t.disabled)return;var a=t.getAttribute('data-act');if(ACT[a]){var d={};for(var i=0;i<t.attributes.length;i++){var at=t.attributes[i];if(at.name.indexOf('data-')===0)d[at.name.slice(5)]=at.value;}ACT[a](d,t);}}

/* ---------- boot ---------- */
function boot(data){
  document.addEventListener('click',onClick);
  if(data&&data.g){G=data.g;stack=data.stack&&data.stack.length?data.stack.filter(function(s){return s.n!=='match'&&s.n!=='post';}):[{n:'menu',p:{}}];if(!stack.length)stack=[{n:'menu',p:{}}];}
  try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {g:G,stack:stack};});}catch(e){}
  render(true);
}
if(typeof module!=='undefined'&&module.exports){
  module.exports={newGame:newGame,createMatch:createMatch,advance:advance,runAuto:runAuto,commitSlot:commitSlot,nextSeason:nextSeason,SCREENS:SCREENS,ACT:ACT,setG:function(g){G=g;},getG:function(){return G;},getM:function(){return M;},setM:function(m){M=m;},stackSet:function(s){stack=s;},nextInfo:nextInfo,tactOf:tactOf,aiTactics:aiTactics,autoPick:autoPick,validateLineup:validateLineup,CAL:CAL};
}else{
  var start=function(d){boot(d);};
  try{if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}catch(e){start({});}
}

})();
</script>
